<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수학 시뮬레이션 갤러리</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>

  <header class="header">
    <p class="header__eyebrow">Performance Assessment</p>
    <h1 class="header__title">수학 시뮬레이션 갤러리</h1>
    <p class="header__subtitle">학생들이 직접 설계하고 구현한 수학 문제 시뮬레이션을 반별로 만나보세요.</p>
    <nav class="class-nav" id="classNav" aria-label="반별 바로가기"></nav>
  </header>

  <main class="gallery" id="gallery"></main>

  <p class="gallery__empty" id="emptyMsg" hidden>
    표시할 시뮬레이션이 없습니다.<br />
    <code>submissions</code> 폴더에 학생 파일을 넣고 <code>npm run generate</code>를 실행해 주세요.
  </p>

  <footer class="footer">
    <p>수행평가 · 수학 시뮬레이터 제작 과제</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
