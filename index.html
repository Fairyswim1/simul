<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IASA 9기 수학세미나 시뮬레이터 갤러리</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>

  <header class="header">
    <span class="header__badge">IASA 9기 · 수학세미나</span>
    <h1 class="header__title">IASA 9기 수학세미나 시뮬레이터 갤러리</h1>
    <p class="header__subtitle">학생들이 직접 만든 수학 시뮬레이션을 반별로 둘러보세요!</p>
    <nav class="class-nav" id="classNav" aria-label="반별 바로가기"></nav>
  </header>

  <main class="gallery" id="gallery"></main>

  <p class="gallery__empty" id="emptyMsg" hidden>
    표시할 시뮬레이션이 없습니다.<br />
    <code>submissions</code> 폴더에 학생 파일을 넣고 <code>npm run generate</code>를 실행해 주세요.
  </p>

  <footer class="footer">
    <p>IASA 9기 수학세미나 · 수학 시뮬레이터 제작 수행평가</p>
  </footer>

  <div class="comment-modal" id="commentModal" hidden>
    <div class="comment-modal__backdrop" id="commentModalBackdrop"></div>
    <div class="comment-modal__panel" role="dialog" aria-labelledby="commentModalTitle" aria-modal="true">
      <div class="comment-modal__header">
        <h2 class="comment-modal__title" id="commentModalTitle">댓글</h2>
        <button type="button" class="comment-modal__close" id="commentModalClose" aria-label="닫기">✕</button>
      </div>
      <div class="comment-modal__list" id="commentList"></div>
      <div class="comment-modal__form">
        <p class="comment-modal__notice">댓글은 <strong>실명</strong>으로 작성해 주세요.</p>
        <input type="text" id="commentAuthorName" class="comment-modal__input" placeholder="이름 (실명)" maxlength="20" autocomplete="name" />
        <textarea id="commentBody" class="comment-modal__textarea" placeholder="응원이나 피드백을 남겨 보세요!" rows="3" maxlength="500"></textarea>
        <button type="button" class="comment-modal__submit" id="commentSubmit">댓글 등록</button>
      </div>
    </div>
  </div>

  <script src="js/firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
