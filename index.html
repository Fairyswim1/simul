<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수학 시뮬레이션 갤러리</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="header">
    <h1 class="header__title">수학 시뮬레이션 갤러리</h1>
    <p class="header__subtitle">학생들이 직접 만든 수학 문제 시뮬레이션을 소개합니다!</p>
  </header>

  <nav class="filter" id="filter" aria-label="반별 필터"></nav>

  <section class="gallery-section">
    <div class="gallery" id="gallery">
      <button class="gallery__arrow gallery__arrow--prev" id="prevBtn" aria-label="이전">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="gallery__track-wrapper">
        <div class="gallery__track" id="track"></div>
      </div>
      <button class="gallery__arrow gallery__arrow--next" id="nextBtn" aria-label="다음">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <p class="gallery__empty" id="emptyMsg" hidden>표시할 시뮬레이션이 없습니다.<br />submissions 폴더에 학생 파일을 넣고 <code>npm run generate</code>를 실행해 주세요.</p>
  </section>

  <footer class="footer">
    <p>수행평가 · 수학 시뮬레이터 제작 과제</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
