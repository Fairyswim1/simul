<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이차곡선 접선 시뮬레이터 (수정본)</title>
    <style>
        body { 
            font-family: 'Malgun Gothic', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            background-color: #f8fafc; 
            margin: 20px; 
            color: #334155;
        }
        .container { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); 
        }
        canvas { 
            border: 1px solid #e2e8f0; 
            border-radius: 8px; 
            cursor: grab; 
            background-color: #ffffff;
        }
        canvas:active { cursor: grabbing; }
        .controls { 
            display: flex; 
            gap: 20px; 
            margin-bottom: 15px; 
            align-items: center; 
            font-size: 16px;
            font-weight: bold;
        }
        .info-box { 
            padding: 15px; 
            background: #eff6ff; 
            border-left: 4px solid #3b82f6;
            border-radius: 4px; 
            margin-bottom: 15px; 
            width: 770px; 
            font-size: 14px;
            line-height: 1.6;
        }
        .formula {
            background: #f1f5f9;
            padding: 10px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        button { 
            padding: 8px 16px; 
            border: none; 
            border-radius: 6px; 
            background: #4f46e5; 
            color: white; 
            font-weight: bold;
            cursor: pointer; 
            transition: background 0.2s;
        }
        button:hover { background: #4338ca; }
        label { cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <label><input type="radio" name="mode" value="1" checked onchange="updateMode()"> (1)번 문제 모드</label>
        <label><input type="radio" name="mode" value="2" onchange="updateMode()"> (2)번 문제 모드</label>
        <button onclick="clearTraces()">자취 지우기</button>
    </div>
    <div id="info" class="info-box">
        </div>
    <canvas id="canvas" width="800" height="650"></canvas>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    
    const scale = 50;
    const originX = width / 2;
    const originY = height - 150; 

    function sx(x) { return originX + x * scale; }
    function sy(y) { return originY - y * scale; }
    function rx(cx) { return (cx - originX) / scale; }
    function ry(cy) { return (originY - cy) / scale; }

    let mode = 1;
    let P = {x: 1, y: -0.5};
    let isDragging = false;
    let traces1 = [];
    let traces2 = [];

    function clearTraces() {
        traces1 = [];
        traces2 = [];
        draw();
    }

    function updateMode() {
        mode = parseInt(document.querySelector('input[name="mode"]:checked').value);
        const info = document.getElementById('info');
        if (mode === 1) {
            P = {x: 1, y: -0.5};
            info.innerHTML = `
                점 P(a, b)가 파란색 영역 <b>(y ≤ x-1, y ≤ -x+1, y ≥ -1)</b> 내에서 움직일 때,<br>
                선분 QR의 중점 <b>M(a, 2a² - b)</b>의 자취를 확인하세요.
                <span class="formula">M_x = a, M_y = 2a² - b</span>
            `;
        } else {
            P = {x: 1, y: -0.2};
            info.innerHTML = `
                점 P(a, b)와 접점 Q, R로 이루어진 <b>△PQR의 넓이 S</b>를 확인하세요.<br>
                넓이가 2가 되는 점 P의 궤적(빨간선)은 <b>y = x² - 1</b> 곡선을 이룹니다.
                <span class="formula">Area S = 2(a² - b)^(3/2) = 2(D)^(3/2)</span>
            `;
        }
        clearTraces();
    }

    function drawAxes() {
        ctx.beginPath();
        ctx.moveTo(0, originY); ctx.lineTo(width, originY);
        ctx.moveTo(originX, 0); ctx.lineTo(originX, height);
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 1;
        ctx.stroke();
        
        ctx.fillStyle = '#94a3b8';
        ctx.font = '12px Arial';
        ctx.fillText('x', width - 15, originY - 10);
        ctx.fillText('y', originX + 10, 15);
    }

    function drawParabola() {
        ctx.beginPath();
        for (let x = -6; x <= 6; x += 0.05) {
            let y = x * x;
            if (x === -6) ctx.moveTo(sx(x), sy(y));
            else ctx.lineTo(sx(x), sy(y));
        }
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    function drawRegionP() {
        // (1)번: P의 제한 영역 (1,0), (0,-1), (2,-1) 삼각형
        ctx.beginPath();
        ctx.moveTo(sx(1), sy(0));
        ctx.lineTo(sx(2), sy(-1));
        ctx.lineTo(sx(0), sy(-1));
        ctx.closePath();
        ctx.fillStyle = 'rgba(59, 130, 246, 0.15)';
        ctx.fill();
        ctx.strokeStyle = '#3b82f6';
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    function drawMode1AnswerRegion() {
        // M의 자취 경계 그리기
        ctx.fillStyle = 'rgba(34, 197, 94, 0.1)';
        ctx.beginPath();
        // M_y = 2a^2+1 (b=-1 일 때)
        for (let x = 0; x <= 2; x += 0.05) ctx.lineTo(sx(x), sy(2*x*x + 1));
        // M_y = 2a^2+a-1 (b=-a+1 일 때)
        for (let x = 2; x >= 1; x -= 0.05) ctx.lineTo(sx(x), sy(2*x*x + x - 1));
        // M_y = 2a^2-a+1 (b=a-1 일 때)
        for (let x = 1; x >= 0; x -= 0.05) ctx.lineTo(sx(x), sy(2*x*x - x + 1));
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(34, 197, 94, 0.3)';
        ctx.stroke();
    }

    function drawPointWithLabel(pt, color, label) {
        ctx.beginPath();
        ctx.arc(sx(pt.x), sy(pt.y), 5, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        
        ctx.fillStyle = '#1e293b';
        ctx.font = 'bold 12px Arial';
        const coordText = `${label}(${pt.x.toFixed(2)}, ${pt.y.toFixed(2)})`;
        ctx.fillText(coordText, sx(pt.x) + 10, sy(pt.y) - 5);
    }

    function drawLinesAndPoints(a, b) {
        let D = a * a - b;
        if (D <= 0) return;

        let t1 = a - Math.sqrt(D);
        let t2 = a + Math.sqrt(D);
        let Q = {x: t1, y: t1 * t1};
        let R = {x: t2, y: t2 * t2};

        // 접선
        ctx.beginPath();
        ctx.moveTo(sx(a - (Q.x - a) * 5), sy(b - (Q.y - b) * 5));
        ctx.lineTo(sx(a + (Q.x - a) * 5), sy(b + (Q.y - b) * 5));
        ctx.moveTo(sx(a - (R.x - a) * 5), sy(b - (R.y - b) * 5));
        ctx.lineTo(sx(a + (R.x - a) * 5), sy(b + (R.y - b) * 5));
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1;
        ctx.stroke();

        drawPointWithLabel(Q, '#3b82f6', 'Q');
        drawPointWithLabel(R, '#3b82f6', 'R');

        if (mode === 1) {
            let M = {x: a, y: 2*a*a - b};
            ctx.beginPath();
            ctx.moveTo(sx(Q.x), sy(Q.y));
            ctx.lineTo(sx(R.x), sy(R.y));
            ctx.strokeStyle = '#94a3b8';
            ctx.setLineDash([4, 4]);
            ctx.stroke();
            ctx.setLineDash([]);
            drawPointWithLabel(M, '#16a34a', 'M');
        } else {
            ctx.beginPath();
            ctx.moveTo(sx(a), sy(b));
            ctx.lineTo(sx(Q.x), sy(Q.y));
            ctx.lineTo(sx(R.x), sy(R.y));
            ctx.closePath();
            ctx.fillStyle = 'rgba(245, 158, 11, 0.2)';
            ctx.fill();
            
            let S = 2 * Math.pow(D, 1.5);
            ctx.fillStyle = '#c2410c';
            ctx.font = 'bold 16px Arial';
            ctx.fillText(`Area S = ${S.toFixed(3)}`, sx(a) + 15, sy(b) + 30);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);
        drawAxes();
        drawParabola();

        if (mode === 1) {
            drawMode1AnswerRegion();
            drawRegionP();
        }

        // 자취 그리기
        if (mode === 1) {
            ctx.fillStyle = '#16a34a';
            for (let p of traces1) { ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), 1.5, 0, Math.PI * 2); ctx.fill(); }
        } else {
            ctx.fillStyle = '#ef4444';
            for (let p of traces2) { ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), 1.5, 0, Math.PI * 2); ctx.fill(); }
        }

        drawLinesAndPoints(P.x, P.y);
        drawPointWithLabel(P, '#ef4444', 'P');
    }

    canvas.addEventListener('mousedown', (e) => {
        let rect = canvas.getBoundingClientRect();
        let mx = rx(e.clientX - rect.left);
        let my = ry(e.clientY - rect.top);
        if (Math.hypot(mx - P.x, my - P.y) < 0.5) isDragging = true;
    });

    window.addEventListener('mouseup', () => isDragging = false);

    canvas.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        let rect = canvas.getBoundingClientRect();
        let mx = rx(e.clientX - rect.left);
        let my = ry(e.clientY - rect.top);

        if (mode === 1) {
            // P의 범위 정확히 제한: y >= -1, y <= x-1, y <= -x+1
            let b = Math.max(-1, Math.min(0, my));
            let minA = b + 1;
            let maxA = 1 - b;
            let a = Math.max(minA, Math.min(maxA, mx));
            
            P.x = a; P.y = b;

            let M = {x: a, y: 2*a*a - b};
            if (traces1.length === 0 || Math.hypot(traces1[traces1.length-1].x - M.x, traces1[traces1.length-1].y - M.y) > 0.05) {
                traces1.push(M);
            }
        } else {
            // 넓이 2 스냅 및 P 위치 제한 (포물선 내부로 못 들어감)
            let targetB = mx * mx - 1; // S=2일 때 b = a^2 - 1
            if (Math.abs(my - targetB) < 0.2) my = targetB;
            my = Math.min(my, mx * mx - 0.05);

            P.x = mx; P.y = my;

            let D = P.x * P.x - P.y;
            let S = 2 * Math.pow(D, 1.5);
            if (Math.abs(S - 2) < 0.05) {
                if (traces2.length === 0 || Math.hypot(traces2[traces2.length-1].x - P.x, traces2[traces2.length-1].y - P.y) > 0.05) {
                    traces2.push({x: P.x, y: P.y});
                }
            }
        }
        draw();
    });

    updateMode();
    draw();
</script>
</body>
</html>
