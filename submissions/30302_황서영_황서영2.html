<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>61번 문항 고도화 기하 시뮬레이터 (오류 수정본)</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .container {
            display: flex;
            gap: 20px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 1050px;
            width: 100%;
        }
        .canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            background-color: #ffffff;
            border: 1px solid #dcdde1;
            border-radius: 8px;
        }
        .control-panel {
            width: 100%;
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        .slider-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 250px;
        }
        input[type="range"] {
            flex-grow: 1;
        }
        button {
            padding: 10px 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button.playing {
            background-color: #e74c3c;
        }
        button.playing:hover {
            background-color: #c0392b;
        }
        button.active {
            background-color: #2ecc71;
        }
        button.active:hover {
            background-color: #27ae60;
        }
        .info-panel {
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .status-box {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
        }
        .status-box h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: #34495e;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }
        .log-box {
            background-color: #2c3e50;
            color: #ecf0f1;
            border-radius: 8px;
            padding: 15px;
            flex-grow: 1;
            overflow-y: auto;
            max-height: 280px;
            font-family: monospace;
            font-size: 13px;
        }
        .log-title {
            font-weight: bold;
            color: #f1c40f;
            margin-bottom: 8px;
        }
        .log-item {
            margin-bottom: 4px;
            border-bottom: 1px solid #34495e;
            padding-bottom: 2px;
        }
        .value-display {
            font-weight: bold;
            color: #e67e22;
        }
        .highlight-text {
            color: #e74c3c;
            font-weight: bold;
            animation: blink 0.5s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <h1>61번 문항 수학 시뮬레이터</h1>
    
    <div class="container">
        <div class="canvas-container">
            <canvas id="simCanvas" width="600" height="600"></canvas>
            
            <div class="control-panel">
                <button id="playBtn">자동 재생</button>
                <div class="slider-container">
                    <span>θ = 0</span>
                    <input type="range" id="thetaSlider" min="0" max="6.283185" step="0.001" value="0">
                    <span>2π</span>
                </div>
                <button id="insightBtn">넓이 영역 시각화: OFF</button>
                <button id="resetTraceBtn" style="background-color: #95a5a6;">로그 초기화</button>
            </div>
        </div>
        
        <div class="info-panel">
            <div class="status-box">
                <h3>실시간 데이터 및 기하 정보</h3>
                <p>세타 (θ): <span id="thetaVal" class="value-display">0.0000</span> rad</p>
                <p>세타 (도): <span id="thetaDeg" class="value-display">0.0</span>°</p>
                <p>점 P 좌표: (<span id="pX" class="value-display">1.00</span>, <span id="pY" class="value-display">0.00</span>)</p>
                <p>점 Q 좌표: (<span id="qX" class="value-display">2.00</span>, <span id="qY" class="value-display">0.00</span>)</p>
                <p id="axisStatus">교점 상태: <span style="color:#7f8c8d;">x축 위에 없음</span></p>
            </div>
            
            <div class="log-box">
                <div class="log-title">■ Q가 x축 위에 놓이는 순간 (y=0)</div>
                <div id="logContent"></div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        
        const playBtn = document.getElementById('playBtn');
        const thetaSlider = document.getElementById('thetaSlider');
        const insightBtn = document.getElementById('insightBtn');
        const resetTraceBtn = document.getElementById('resetTraceBtn');
        
        const thetaVal = document.getElementById('thetaVal');
        const thetaDeg = document.getElementById('thetaDeg');
        const pXDisp = document.getElementById('pX');
        const pYDisp = document.getElementById('pY');
        const qXDisp = document.getElementById('qX');
        const qYDisp = document.getElementById('qY');
        const axisStatus = document.getElementById('axisStatus');
        const logContent = document.getElementById('logContent');

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const scale = 130; 

        let theta = 0;
        let prevTheta = 0; 
        let isPlaying = false;
        let showInsight = false;
        let animationFrameId = null;
        
        let maxThetaReached = 0;
        
        // 특정 영역 필터링을 제거하고, 순수하게 통과한 각도 구역(근사 정수값 기준)을 관리하는 Set
        let loggedAngles = new Set(); 

        // Q의 좌표 계산 함수
        function getQCoordsForTheta(t) {
            return {
                x: Math.cos(t) + Math.cos(2 * t),
                y: Math.sin(t) + Math.sin(2 * t)
            };
        }

        // 전면 개편된 완벽한 x축 통과 순간 검출 알고리즘
        function checkAxisCrossing(tCurr, tPrev) {
            if (tCurr === tPrev) return;

            // 순방향으로 진행할 때만 로그를 기록 (슬라이더를 앞으로 밀거나 자동재생 시)
            if (tCurr < tPrev) return;

            const yCurr = getQCoordsForTheta(tCurr).y;
            const yPrev = getQCoordsForTheta(tPrev).y;

            // 사이값 정리 규칙에 의해 부호가 교차했거나 현재 y값이 아주 정밀하게 0인 경우
            if ((yCurr * yPrev <= 0) || Math.abs(yCurr) < 0.001) {
                // 더 0에 인접한 실제 정확한 theta 값을 추적
                let tExact = Math.abs(yCurr) < Math.abs(yPrev) ? tCurr : tPrev;
                let degExact = tExact * 180 / Math.PI;

                // 60도 단위를 기준으로 가장 가까운 정수 각도(대표값)를 계산하여 중복 기록 방지 키로 활용
                // 예: 59.8도나 60.2도 모두 대표값 '60'으로 묶임
                let representativeAngle = Math.round(degExact / 5) * 5; 
                
                // 360도 경계선 보정
                if (representativeAngle >= 360) representativeAngle = 0;

                if (!loggedAngles.has(representativeAngle)) {
                    loggedAngles.add(representativeAngle);
                    
                    // 분석용 수학 표현 텍스트 가이드 매핑
                    let thetaExpression = "특수각 분석";
                    if (representativeAngle === 0) {
                        thetaExpression = degExact < 180 ? "θ = 0" : "θ = 2π (360°)";
                    }
                    else if (Math.abs(representativeAngle - 60) <= 5) thetaExpression = "θ = π/3 (60°)";
                    else if (Math.abs(representativeAngle - 180) <= 5) thetaExpression = "θ = π (180°)";
                    else if (Math.abs(representativeAngle - 300) <= 5) thetaExpression = "θ = 5π/3 (300°)";

                    const logItem = document.createElement('div');
                    logItem.className = 'log-item';
                    logItem.innerHTML = `[검출] <span style="color:#f1c40f; font-weight:bold;">${thetaExpression}</span><br>→ 정밀값: ${tExact.toFixed(4)} rad (${degExact.toFixed(1)}°)`;
                    logContent.appendChild(logItem);
                    logContent.scrollTop = logContent.scrollHeight;
                }
            }
        }

        // 이벤트 제어
        thetaSlider.addEventListener('input', (e) => {
            prevTheta = theta;
            theta = parseFloat(e.target.value);
            
            if (theta < prevTheta) {
                maxThetaReached = theta; 
            } else {
                if (theta > maxThetaReached) maxThetaReached = theta;
            }

            checkAxisCrossing(theta, prevTheta);
            updateSimulation();
        });

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                isPlaying = false;
                playBtn.textContent = "자동 재생";
                playBtn.classList.remove('playing');
                cancelAnimationFrame(animationFrameId);
            } else {
                isPlaying = true;
                playBtn.textContent = "일시정지";
                playBtn.classList.add('playing');
                animate();
            }
        });

        insightBtn.addEventListener('click', () => {
            showInsight = !showInsight;
            insightBtn.textContent = showInsight ? "넓이 영역 시각화: ON" : "넓이 영역 시각화: OFF";
            insightBtn.classList.toggle('active', showInsight);
            updateSimulation();
        });

        resetTraceBtn.addEventListener('click', () => {
            loggedAngles.clear();
            logContent.innerHTML = '';
            maxThetaReached = theta;
            updateSimulation();
        });

        function animate() {
            if (!isPlaying) return;
            
            prevTheta = theta;
            theta += 0.006; // 로그를 더 정밀하고 안전하게 수집하기 위해 프레임 보폭 최적화
            
            if (theta > Math.PI * 2) {
                theta = 0;
                prevTheta = 0;
                maxThetaReached = 0; 
                loggedAngles.clear(); // 한 바퀴 회전 완료 시 초기화
            }
            
            if (theta > maxThetaReached) {
                maxThetaReached = theta;
            }
            
            thetaSlider.value = theta;
            checkAxisCrossing(theta, prevTheta);
            updateSimulation();
            animationFrameId = requestAnimationFrame(animate);
        }

        function updateSimulation() {
            const p_x = Math.cos(theta);
            const p_y = Math.sin(theta);
            const qCoords = getQCoordsForTheta(theta);
            const q_x = qCoords.x;
            const q_y = qCoords.y;

            thetaVal.textContent = theta.toFixed(4);
            thetaDeg.textContent = (theta * 180 / Math.PI).toFixed(1);
            pXDisp.textContent = p_x.toFixed(2);
            pYDisp.textContent = p_y.toFixed(2);
            qXDisp.textContent = q_x.toFixed(2);
            qYDisp.textContent = q_y.toFixed(2);

            // 실시간 교점 상태 텍스트 가시성 조건 (y가 0에 근접할 때)
            let isOnAxisNow = Math.abs(q_y) < 0.05; 
            if (isOnAxisNow) {
                axisStatus.innerHTML = `<span class="highlight-text">★ x축 통과 중! ★</span>`;
            } else {
                axisStatus.innerHTML = `<span style="color:#7f8c8d;">x축 위에 없음</span>`;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();

            let px_screen = centerX + p_x * scale;
            let py_screen = centerY - p_y * scale;
            let qx_screen = centerX + q_x * scale;
            let qy_screen = centerY - q_y * scale;

            // 넓이 시각화 채우기
            if (showInsight) {
                ctx.beginPath();
                for (let t = 0; t <= Math.PI * 2; t += 0.01) {
                    let pt = getQCoordsForTheta(t);
                    let cx = centerX + pt.x * scale;
                    let cy = centerY - pt.y * scale;
                    if (t === 0) ctx.moveTo(cx, cy);
                    else ctx.lineTo(cx, cy);
                }
                ctx.closePath();
                ctx.fillStyle = 'rgba(52, 152, 219, 0.25)'; 
                ctx.fill();
                ctx.strokeStyle = '#2980b9'; 
                ctx.lineWidth = 2.5;
                ctx.stroke();
            }

            // 실시간 자취 곡선 렌더링
            ctx.beginPath();
            ctx.strokeStyle = '#e74c3c'; 
            ctx.lineWidth = 3;
            let step = 0.005;
            let first = true;
            for (let t = 0; t <= maxThetaReached; t += step) {
                let pt = getQCoordsForTheta(t);
                let cx = centerX + pt.x * scale;
                let cy = centerY - pt.y * scale;
                if (first) {
                    ctx.moveTo(cx, cy);
                    first = false;
                } else {
                    ctx.lineTo(cx, cy);
                }
            }
            ctx.lineTo(qx_screen, qy_screen);
            ctx.stroke();

            // 구조 보조선 및 기초원
            ctx.beginPath(); ctx.arc(centerX, centerY, scale, 0, Math.PI * 2);
            ctx.strokeStyle = '#bdc3c7'; ctx.lineWidth = 1.2; ctx.setLineDash([4, 4]); ctx.stroke();
            ctx.setLineDash([]);

            ctx.beginPath(); ctx.arc(px_screen, py_screen, scale, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(52, 152, 219, 0.4)'; ctx.lineWidth = 1.5; ctx.stroke();

            // 부채꼴 θ (원점 주변)
            ctx.save(); ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, -theta, true);
            ctx.strokeStyle = '#e67e22'; ctx.lineWidth = 2; ctx.stroke();
            let textAngle = theta / 2;
            ctx.fillStyle = '#e67e22'; ctx.font = 'italic bold 15px sans-serif';
            ctx.fillText('θ', centerX + 38 * Math.cos(textAngle), centerY - 38 * Math.sin(textAngle));
            ctx.restore();

            // OP 연장선 점선
            ctx.save(); ctx.setLineDash([3, 5]); ctx.strokeStyle = '#7f8c8d'; ctx.beginPath();
            ctx.moveTo(px_screen, py_screen);
            ctx.lineTo(px_screen + p_x * scale * 0.6, py_screen - p_y * scale * 0.6);
            ctx.stroke(); ctx.restore();

            // 부채꼴 θ (점 P 주변)
            ctx.save(); ctx.beginPath();
            let baseAngle = Math.atan2(p_y, p_x);
            let targetAngle = baseAngle + theta;
            ctx.arc(px_screen, py_screen, 35, -baseAngle, -targetAngle, true);
            ctx.strokeStyle = '#9b59b6'; ctx.lineWidth = 2; ctx.stroke();
            let midAngle = baseAngle + (theta / 2);
            ctx.fillStyle = '#9b59b6'; ctx.font = 'italic bold 15px sans-serif';
            ctx.fillText('θ', px_screen + 45 * Math.cos(midAngle), py_screen - 45 * Math.sin(midAngle));
            ctx.restore();

            // 선분 드로잉
            ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.lineTo(px_screen, py_screen);
            ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2.5; ctx.stroke();

            ctx.beginPath(); ctx.moveTo(px_screen, py_screen); ctx.lineTo(qx_screen, qy_screen);
            ctx.strokeStyle = '#8e44ad'; ctx.lineWidth = 2.5; ctx.stroke();

            // 좌표 노드 표시
            ctx.beginPath(); ctx.arc(centerX, centerY, 5, 0, Math.PI * 2); ctx.fillStyle = '#2c3e50'; ctx.fill();
            ctx.fillText('O', centerX - 15, centerY + 18);

            ctx.beginPath(); ctx.arc(px_screen, py_screen, 5, 0, Math.PI * 2); ctx.fillStyle = '#3498db'; ctx.fill();
            ctx.fillText('P', px_screen - 5, py_screen - 12);

            ctx.beginPath(); ctx.arc(qx_screen, qy_screen, isOnAxisNow ? 8 : 6, 0, Math.PI * 2);
            ctx.fillStyle = isOnAxisNow ? '#e74c3c' : '#8e44ad'; ctx.fill();
            if (isOnAxisNow) {
                ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 3; ctx.stroke();
            }
            ctx.fillStyle = '#2c3e50'; ctx.font = "bold 14px sans-serif";
            ctx.fillText('Q', qx_screen + 10, qy_screen - 5);
        }

        function drawGrid() {
            ctx.strokeStyle = '#f1f2f6'; ctx.lineWidth = 1;
            let step = scale / 2;
            for (let x = 0; x < canvas.width; x += step) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += step) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
            ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, centerY); ctx.lineTo(canvas.width, centerY); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(centerX, 0); ctx.lineTo(centerX, canvas.height); ctx.stroke();
        }

        updateSimulation();
    </script>
</body>
</html>
