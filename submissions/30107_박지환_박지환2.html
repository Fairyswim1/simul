<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교점 Q의 자취 시뮬레이션</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 캔버스 드래그 시 화면 스크롤 방지 */
        canvas {
            touch-action: none;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        
        /* 커스텀 슬라이더 스타일링 */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #2563eb;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0,0,0,0.2);
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #e2e8f0;
            border-radius: 999px;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen p-4 md:p-8 font-sans flex items-center justify-center">

    <div class="max-w-6xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col lg:flex-row border border-slate-200/60">
        
        <!-- 캔버스 영역 -->
        <div class="p-4 lg:p-8 flex-1 flex flex-col items-center justify-center bg-slate-50/50 border-b lg:border-b-0 lg:border-r border-slate-200 relative">
            <div class="w-full flex justify-between items-end mb-4 px-2">
                <h2 class="text-2xl font-bold text-slate-800 tracking-tight">시뮬레이션 화면</h2>
                <p class="text-xs font-medium text-slate-400 bg-slate-200/50 px-3 py-1 rounded-full">Interactive Graph</p>
            </div>
            
            <div class="relative bg-white rounded-2xl shadow-sm border border-slate-200 p-2 w-full max-w-[600px] aspect-square flex items-center justify-center">
                <canvas id="simCanvas" width="600" height="600" class="max-w-full h-auto block rounded-xl"></canvas>
            </div>
            
            <p class="text-sm text-slate-500 mt-4 text-center bg-blue-50 text-blue-600 px-4 py-2 rounded-lg font-medium">
                💡 점 P를 마우스로 직접 드래그하거나 우측 패널에서 조작해보세요.
            </p>
        </div>

        <!-- 컨트롤 패널 영역 -->
        <div class="p-6 lg:p-8 lg:w-[420px] flex flex-col gap-8 bg-white">
            
            <!-- 헤더 설명 -->
            <div>
                <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 mb-3">
                    자취의 방정식 탐구
                </h1>
                <p class="text-slate-600 text-sm leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-100">
                    선분 AB를 지름으로 하는 원 위의 동점 P에 대하여,<br>
                    <span class="block mt-1">• 점 <b class="text-orange-600">N</b> : 선분 PA를 3:4로 내분</span>
                    <span class="block">• 점 <b class="text-orange-600">M</b> : 선분 PB를 1:4로 내분</span>
                    직선 AM과 BN의 교점 <b class="text-green-600">Q</b>의 자취를 확인합니다.
                </p>
            </div>

            <!-- 조작 컨트롤러 -->
            <div class="flex flex-col gap-4">
                <div class="flex items-center justify-between">
                    <label for="thetaSlider" class="block text-sm font-bold text-slate-700">
                        점 P의 위치 (각도: <span id="angleValue" class="text-blue-600 w-8 inline-block text-right">60</span>°)
                    </label>
                    <button id="autoPlayBtn" class="flex items-center gap-1.5 px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-lg transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-1">
                        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6z"/></svg>
                        자동 재생
                    </button>
                </div>
                <!-- 버그 수정: step="0.1" 속성 추가 -->
                <input type="range" id="thetaSlider" min="1" max="359" step="0.1" value="60" class="w-full">
            </div>

            <!-- 실시간 좌표 정보 패널 -->
            <div class="flex-1 flex flex-col">
                <h3 class="text-sm font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    실시간 좌표 정보
                </h3>
                
                <div class="grid grid-cols-2 gap-3 text-sm font-mono">
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex flex-col justify-center">
                        <span class="text-xs font-bold text-slate-500 mb-1">고정점 A</span>
                        <span class="text-slate-800">(-1.00, 0.00)</span>
                    </div>
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex flex-col justify-center">
                        <span class="text-xs font-bold text-slate-500 mb-1">고정점 B</span>
                        <span class="text-slate-800">(1.00, 0.00)</span>
                    </div>
                    
                    <div class="bg-blue-50 p-3 rounded-xl border border-blue-100 flex flex-col justify-center col-span-2 shadow-sm">
                        <span class="text-xs font-bold text-blue-600 mb-1 flex items-center justify-between">
                            <span>동점 P (원주 위)</span>
                        </span>
                        <span id="coordP" class="text-blue-800 text-base font-semibold"></span>
                    </div>

                    <div class="bg-orange-50 p-3 rounded-xl border border-orange-100 flex flex-col justify-center">
                        <span class="text-xs font-bold text-orange-600 mb-1">내분점 M</span>
                        <span id="coordM" class="text-orange-800"></span>
                    </div>
                    <div class="bg-orange-50 p-3 rounded-xl border border-orange-100 flex flex-col justify-center">
                        <span class="text-xs font-bold text-orange-600 mb-1">내분점 N</span>
                        <span id="coordN" class="text-orange-800"></span>
                    </div>
                    
                    <div class="bg-green-50 p-4 rounded-xl border border-green-200 flex flex-col justify-center col-span-2 shadow-sm mt-1">
                        <span class="text-xs font-bold text-green-700 mb-1">교점 Q (자취)</span>
                        <span id="coordQ" class="text-green-800 text-lg font-bold"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const thetaSlider = document.getElementById('thetaSlider');
        const angleValue = document.getElementById('angleValue');
        
        const coordP = document.getElementById('coordP');
        const coordM = document.getElementById('coordM');
        const coordN = document.getElementById('coordN');
        const coordQ = document.getElementById('coordQ');
        const autoPlayBtn = document.getElementById('autoPlayBtn');

        // 자동 재생 관련 변수
        let isAutoPlaying = false;
        let animationFrameId = null;

        // 캔버스 설정 (단위 길이당 픽셀 수)
        const scale = 200; // 1단위 = 200픽셀
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        // 수학적 좌표를 캔버스 좌표로 변환
        function toCanvas(x, y) {
            return {
                x: cx + x * scale,
                y: cy - y * scale // y축은 수학과 반대 방향
            };
        }

        // 고정점 좌표
        const A = { x: -1, y: 0 };
        const B = { x: 1, y: 0 };

        // 교점 계산 함수 (두 직선의 교점)
        function getIntersection(p1, p2, p3, p4) {
            const det = (p1.x - p2.x) * (p3.y - p4.y) - (p1.y - p2.y) * (p3.x - p4.x);
            if (det === 0) return null; // 평행

            const t = ((p1.x - p3.x) * (p3.y - p4.y) - (p1.y - p3.y) * (p3.x - p4.x)) / det;
            return {
                x: p1.x + t * (p2.x - p1.x),
                y: p1.y + t * (p2.y - p1.y)
            };
        }

        // 자취 궤적 배열 미리 계산 (부드러운 선분을 위해)
        const locusPoints = [];
        for (let i = 1; i < 360; i++) {
            if (i === 180) continue; // A, B와 겹치는 점 제외
            const rad = i * Math.PI / 180;
            const P = { x: Math.cos(rad), y: Math.sin(rad) };
            const N = { x: (3 * A.x + 4 * P.x) / 7, y: (3 * A.y + 4 * P.y) / 7 };
            const M = { x: (1 * B.x + 4 * P.x) / 5, y: (1 * B.y + 4 * P.y) / 5 };
            const Q = getIntersection(A, M, B, N);
            if (Q) locusPoints.push(Q);
        }

        function drawPoint(pt, color, radius = 4, label = '', offsetX = 10, offsetY = -10) {
            const cp = toCanvas(pt.x, pt.y);
            ctx.beginPath();
            ctx.arc(cp.x, cp.y, radius, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            
            if (label) {
                ctx.font = 'bold 15px Pretendard, sans-serif';
                ctx.fillStyle = color;
                // 약간의 흰색 외곽선을 주어 글씨가 잘 보이게 처리
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.strokeText(label, cp.x + offsetX, cp.y + offsetY);
                ctx.fillText(label, cp.x + offsetX, cp.y + offsetY);
            }
        }

        function drawLine(pt1, pt2, color, width = 1, isDash = false) {
            const cp1 = toCanvas(pt1.x, pt1.y);
            const cp2 = toCanvas(pt2.x, pt2.y);
            ctx.beginPath();
            ctx.moveTo(cp1.x, cp1.y);
            ctx.lineTo(cp2.x, cp2.y);
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            if (isDash) ctx.setLineDash([6, 6]); // 점선 간격 조정
            else ctx.setLineDash([]);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 그리드 및 축 그리기
            ctx.strokeStyle = '#f1f5f9';
            ctx.lineWidth = 1;
            for (let i = -2; i <= 2; i += 0.25) {
                // 촘촘한 세로선/가로선
                ctx.beginPath(); ctx.moveTo(cx + i * scale, 0); ctx.lineTo(cx + i * scale, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, cy - i * scale); ctx.lineTo(canvas.width, cy - i * scale); ctx.stroke();
            }
            
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); ctx.stroke(); // X축
            ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height); ctx.stroke(); // Y축

            // 원점, 좌표값 표시
            ctx.fillStyle = '#94a3b8';
            ctx.font = '12px sans-serif';
            ctx.fillText('O', cx - 14, cy + 16);
            ctx.fillText('1', cx + scale - 5, cy + 16);
            ctx.fillText('-1', cx - scale - 12, cy + 16);
            ctx.fillText('1', cx + 6, cy - scale + 5);

            // 2. Q의 전체 자취 그리기 (항상 표시)
            ctx.beginPath();
            for (let i = 0; i < locusPoints.length; i++) {
                const cp = toCanvas(locusPoints[i].x, locusPoints[i].y);
                if (i === 0) ctx.moveTo(cp.x, cp.y);
                else ctx.lineTo(cp.x, cp.y);
            }
            ctx.strokeStyle = 'rgba(34, 197, 94, 0.6)'; // 조금 더 진한 녹색으로 항상 표시
            ctx.lineWidth = 4;
            ctx.stroke();

            // 3. 메인 원 (지름 AB)
            ctx.beginPath();
            ctx.arc(cx, cy, scale, 0, Math.PI * 2);
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 각도 및 동점 P 계산
            const thetaDeg = parseFloat(thetaSlider.value);
            const thetaRad = thetaDeg * Math.PI / 180;
            const P = { x: Math.cos(thetaRad), y: Math.sin(thetaRad) };

            // 선분 내분점 M, N 계산
            const N = { x: (3 * A.x + 4 * P.x) / 7, y: (3 * A.y + 4 * P.y) / 7 };
            const M = { x: (1 * B.x + 4 * P.x) / 5, y: (1 * B.y + 4 * P.y) / 5 };

            // 교점 Q 계산
            const Q = getIntersection(A, M, B, N);

            // 4. 선 그리기 (요청사항: AM, BN 점선 / AQ, BQ 실선 잇지 않음)
            drawLine(A, P, '#cbd5e1', 1, true); // PA
            drawLine(B, P, '#cbd5e1', 1, true); // PB
            
            // Q가 존재할 때 A부터 Q, B부터 Q까지를 '점선'으로만 그립니다.
            if (Q) {
                drawLine(A, Q, '#3b82f6', 2, true); // AQ (M을 지나는 연장 점선)
                drawLine(B, Q, '#ef4444', 2, true); // BQ (N을 지나는 연장 점선)
            } else {
                drawLine(A, M, '#3b82f6', 2, true);
                drawLine(B, N, '#ef4444', 2, true);
            }

            // 5. 점 그리기
            drawPoint(A, '#0f172a', 5, 'A', -25, -10);
            drawPoint(B, '#0f172a', 5, 'B', 15, -10);
            drawPoint(P, '#2563eb', 7, 'P', 12, -12);
            drawPoint(M, '#ea580c', 4, 'M', 10, 15);
            drawPoint(N, '#ea580c', 4, 'N', -20, 15);
            
            if (Q) {
                drawPoint(Q, '#16a34a', 7, 'Q', 15, -10);
            }

            // 6. UI 업데이트
            angleValue.textContent = Math.round(thetaDeg);
            coordP.textContent = `(${P.x.toFixed(2)}, ${P.y.toFixed(2)})`;
            coordM.textContent = `(${M.x.toFixed(2)}, ${M.y.toFixed(2)})`;
            coordN.textContent = `(${N.x.toFixed(2)}, ${N.y.toFixed(2)})`;
            
            if (Q) {
                coordQ.textContent = `(${Q.x.toFixed(2)}, ${Q.y.toFixed(2)})`;
            } else {
                coordQ.textContent = '계산 불가 (평행)';
            }
        }

        // 자동 재생 로직
        function toggleAutoPlay() {
            isAutoPlaying = !isAutoPlaying;
            
            if (isAutoPlaying) {
                autoPlayBtn.innerHTML = '<svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/></svg> 일시 정지';
                autoPlayBtn.classList.replace('bg-blue-600', 'bg-red-500');
                autoPlayBtn.classList.replace('hover:bg-blue-700', 'hover:bg-red-600');
                autoPlayBtn.classList.replace('focus:ring-blue-500', 'focus:ring-red-500');
                animate();
            } else {
                autoPlayBtn.innerHTML = '<svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6z"/></svg> 자동 재생';
                autoPlayBtn.classList.replace('bg-red-500', 'bg-blue-600');
                autoPlayBtn.classList.replace('hover:bg-red-600', 'hover:bg-blue-700');
                autoPlayBtn.classList.replace('focus:ring-red-500', 'focus:ring-blue-500');
                cancelAnimationFrame(animationFrameId);
            }
        }

        function animate() {
            if (!isAutoPlaying) return;
            
            let currentVal = parseFloat(thetaSlider.value);
            currentVal += 0.8; // 재생 속도 2배 증가 (0.4 -> 0.8)
            if (currentVal >= 360) currentVal = 1;
            
            thetaSlider.value = currentVal;
            render();
            
            animationFrameId = requestAnimationFrame(animate);
        }

        // 이벤트 리스너
        thetaSlider.addEventListener('input', () => {
            if (isAutoPlaying) toggleAutoPlay(); // 수동 조작 시 자동재생 중지
            render();
        });
        autoPlayBtn.addEventListener('click', toggleAutoPlay);

        // 캔버스 마우스/터치 드래그 연동
        let isDragging = false;

        function updateAngleFromEvent(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const x = clientX - rect.left - cx;
            const y = cy - (clientY - rect.top); // y축 반전 복구
            
            let angleRad = Math.atan2(y, x);
            if (angleRad < 0) angleRad += 2 * Math.PI;
            
            let angleDeg = Math.round(angleRad * 180 / Math.PI);
            
            if (angleDeg === 0) angleDeg = 1;
            if (angleDeg === 180) angleDeg = 179;
            if (angleDeg === 360) angleDeg = 359;

            thetaSlider.value = angleDeg;
            render();
        }

        canvas.addEventListener('mousedown', (e) => { 
            isDragging = true; 
            if (isAutoPlaying) toggleAutoPlay();
            updateAngleFromEvent(e); 
        });
        canvas.addEventListener('mousemove', (e) => { if (isDragging) updateAngleFromEvent(e); });
        window.addEventListener('mouseup', () => { isDragging = false; });

        canvas.addEventListener('touchstart', (e) => { 
            isDragging = true; 
            if (isAutoPlaying) toggleAutoPlay();
            updateAngleFromEvent(e); 
        });
        canvas.addEventListener('touchmove', (e) => { if (isDragging) updateAngleFromEvent(e); });
        window.addEventListener('touchend', () => { isDragging = false; });

        // 초기 렌더링
        render();
    </script>
</body>
</html>
