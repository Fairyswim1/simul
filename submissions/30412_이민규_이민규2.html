<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회전체의 부피 시뮬레이터 (최종본)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { margin: 0; overflow: hidden; font-family: 'Pretendard', sans-serif; background-color: #1e293b; color: white; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #ui-panel { position: absolute; top: 20px; left: 20px; z-index: 10; max-height: 90vh; overflow-y: auto; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-panel" class="w-80 bg-slate-900/90 backdrop-blur-md p-6 rounded-2xl shadow-2xl border border-slate-700">
        <h2 class="text-xl font-bold text-white tracking-tight mb-1">회전체의 부피 시뮬레이션</h2>
        <p class="text-xs text-slate-400 mb-6 italic">x축 중심 회전체 시각화 및 데이터</p>

        <div class="space-y-5">
            <div>
                <div class="flex justify-between text-sm font-bold text-slate-300 mb-2">
                    <span>회전 각도 (Phi)</span>
                    <span id="phiVal" class="text-cyan-400">0°</span>
                </div>
                <input type="range" id="phiSlider" min="0" max="360" value="0" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-cyan-500">
                <button id="autoRevBtn" class="mt-3 w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 px-4 rounded text-sm transition">
                    ▶ 자동 회전 애니메이션
                </button>
            </div>

            <div class="pt-4 border-t border-slate-700">
                <div class="flex justify-between text-sm font-bold text-slate-300 mb-2">
                    <span>점 P 위치 (Theta)</span>
                    <span id="thetaVal" class="text-red-400">0 rad</span>
                </div>
                <input type="range" id="thetaSlider" min="0" max="1.5708" step="0.01" value="0" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-red-500">
            </div>
        </div>

        <div class="mt-6 bg-black/50 rounded-xl p-4 border border-slate-800 space-y-3">
            <h3 class="text-xs font-bold text-slate-500 uppercase tracking-widest border-b border-slate-800 pb-2">Analysis Data</h3>
            <div class="flex justify-between items-center text-sm">
                <span class="text-slate-400">회전 반지름 <span class="italic text-[10px]">r(θ)</span></span>
                <span id="radiusData" class="mono text-green-400">1.000</span>
            </div>
            <div class="flex justify-between items-center text-sm pt-2">
                <span class="text-slate-400">이론적 부피 (정적분)</span>
                <span class="mono text-yellow-400 font-bold">5π / 3</span>
            </div>
            <div class="flex justify-between items-center text-sm">
                <span class="text-slate-400">현재 회전체 부피</span>
                <span id="volData" class="mono text-yellow-400 font-bold">0.000</span>
            </div>
        </div>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 2, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        scene.add(new THREE.AxesHelper(3));
        
        const maxTheta = Math.PI / 2;
        const curvePoints = [];
        const lathePoints = [];

        for(let t = 0; t <= maxTheta + 0.01; t += 0.02) {
            let x = Math.cos(t);
            let y = Math.cos(t);
            let z = Math.sqrt(2) * Math.sin(t);
            curvePoints.push(new THREE.Vector3(x, y, z));
            let r = Math.sqrt(y*y + z*z);
            lathePoints.push(new THREE.Vector2(r, x));
        }

        const curveGeo = new THREE.BufferGeometry().setFromPoints(curvePoints);
        const curveMat = new THREE.LineBasicMaterial({ color: 0x3b82f6, linewidth: 3 });
        scene.add(new THREE.Line(curveGeo, curveMat));

        const pMat = new THREE.MeshPhongMaterial({ color: 0xef4444 });
        const pointP = new THREE.Mesh(new THREE.SphereGeometry(0.06, 32, 32), pMat);
        scene.add(pointP);

        const radiusMat = new THREE.LineDashedMaterial({ color: 0x10b981, dashSize: 0.1, gapSize: 0.05 });
        const radiusGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0)]);
        const radiusLine = new THREE.Line(radiusGeo, radiusMat);
        scene.add(radiusLine);

        let solidMesh = null;
        const solidMat = new THREE.MeshPhysicalMaterial({
            color: 0x06b6d4, transparent: true, opacity: 0.4, side: THREE.DoubleSide
        });

        const phiSlider = document.getElementById('phiSlider');
        const thetaSlider = document.getElementById('thetaSlider');
        const autoRevBtn = document.getElementById('autoRevBtn');
        let isAutoRevolving = false;
        
        function updateSolid() {
            const phiDeg = parseFloat(phiSlider.value);
            const phiRad = phiDeg * Math.PI / 180;
            document.getElementById('phiVal').innerText = phiDeg + "°";
            if (solidMesh) { scene.remove(solidMesh); solidMesh.geometry.dispose(); }
            if (phiRad > 0) {
                const latheGeo = new THREE.LatheGeometry(lathePoints, 64, 0, phiRad);
                solidMesh = new THREE.Mesh(latheGeo, solidMat);
                solidMesh.rotation.z = -Math.PI / 2;
                scene.add(solidMesh);
            }
            document.getElementById('volData').innerText = ((5 * Math.PI / 3) * (phiDeg / 360)).toFixed(3);
        }

        function updatePointP() {
            const theta = parseFloat(thetaSlider.value);
            document.getElementById('thetaVal').innerText = theta.toFixed(2) + " rad";
            const px = Math.cos(theta), py = Math.cos(theta), pz = Math.sqrt(2) * Math.sin(theta);
            pointP.position.set(px, py, pz);
            radiusGeo.setFromPoints([new THREE.Vector3(px, 0, 0), new THREE.Vector3(px, py, pz)]);
            radiusLine.computeLineDistances();
            document.getElementById('radiusData').innerText = Math.sqrt(py*py + pz*pz).toFixed(3);
        }

        phiSlider.addEventListener('input', () => { isAutoRevolving = false; updateSolid(); });
        thetaSlider.addEventListener('input', updatePointP);
        autoRevBtn.addEventListener('click', () => {
            isAutoRevolving = !isAutoRevolving;
            autoRevBtn.innerText = isAutoRevolving ? "■ 애니메이션 정지" : "▶ 자동 회전 애니메이션";
        });

        updateSolid(); updatePointP();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (isAutoRevolving) {
                let v = parseFloat(phiSlider.value);
                v = (v + 2) % 362;
                if(v >= 360) { v = 360; isAutoRevolving = false; autoRevBtn.innerText = "▶ 자동 회전 애니메이션"; }
                phiSlider.value = v; updateSolid();
            }
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
