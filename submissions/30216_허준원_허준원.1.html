<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>확률 분포 및 극한 시뮬레이터 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --even-color: rgba(241, 196, 15, 0.8);
            --even-border: rgba(243, 156, 18, 1);
            --odd-color: rgba(52, 152, 219, 0.6);
            --odd-border: rgba(41, 128, 185, 1);
            --bg: #ecf0f1;
            --panel-bg: #ffffff;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: #333; margin: 0; padding: 20px; }
        h1 { text-align: center; color: var(--primary); font-size: 26px; margin-bottom: 20px; }
        
        /* Dashboard Layout */
        .dashboard { display: grid; grid-template-columns: 300px 1fr; gap: 20px; max-width: 1200px; margin: auto; }
        .panel { background: var(--panel-bg); padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        /* Controls */
        .controls { display: flex; flex-direction: column; gap: 15px; }
        .input-group { display: flex; flex-direction: column; }
        .input-group label { font-size: 13px; font-weight: bold; margin-bottom: 5px; color: var(--secondary); }
        .input-group input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        button { background-color: var(--accent); color: white; border: none; padding: 12px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.3s; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        /* Text Results */
        .result-summary { font-size: 15px; line-height: 1.6; padding: 15px; background: #f8f9fa; border-left: 4px solid var(--accent); border-radius: 4px; margin-bottom: 20px; }
        .highlight { font-weight: bold; color: #e74c3c; }
        
        /* Charts Area */
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .chart-container { position: relative; height: 300px; width: 100%; }
        
        /* Last Trial Animation */
        .last-trial-section { display: flex; align-items: center; justify-content: center; gap: 30px; background: #fafafa; border: 1px solid #eee; padding: 20px; border-radius: 8px; min-height: 150px; }
        .pie-container { width: 120px; height: 120px; }
        .balls-container { display: flex; gap: 10px; flex-wrap: wrap; flex: 1; justify-content: flex-start; }
        .ball { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 15px; box-shadow: 0 3px 6px rgba(0,0,0,0.2); opacity: 0; transform: scale(0.3); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .ball.show { opacity: 1; transform: scale(1); }
        .ball.red { background: radial-gradient(circle at 30% 30%, #ff7675, #d63031); }
        .ball.blue { background: radial-gradient(circle at 30% 30%, #74b9ff, #0984e3); }
    </style>
</head>
<body>

<h1>확률 분포 및 극한 시뮬레이터 대시보드</h1>

<div class="dashboard">
    <div class="panel controls">
        <div class="input-group">
            <label for="N">상자 수 (N)</label>
            <input type="number" id="N" value="10" min="1">
        </div>
        <div class="input-group">
            <label for="m">추출 횟수 (m)</label>
            <input type="number" id="m" value="3" min="1">
        </div>
        <div class="input-group">
            <label for="trials">시뮬레이션 횟수 (최대 100만 권장)</label>
            <input type="number" id="trials" value="10000" min="100">
        </div>
        <button id="startBtn">실험 시작</button>
        
        <div id="textResult" class="result-summary" style="display: none; margin-top: 20px;">
            </div>
    </div>

    <div class="panel main-content">
        <div class="charts-grid">
            <div class="chart-container">
                <canvas id="distChart"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="compareChart"></canvas>
            </div>
        </div>

        <h3>마지막 시행 시각화 (랜덤 선택된 상자 내부 및 추출 결과)</h3>
        <div class="last-trial-section">
            <div class="pie-container">
                <canvas id="boxPieChart"></canvas>
            </div>
            <div class="balls-container" id="ballsContainer">
                <span style="color: #999; margin-top: 50px;">설정값을 입력하고 '실험 시작'을 눌러주세요.</span>
            </div>
        </div>
    </div>
</div>

<script>
    let distChart = null;
    let compareChart = null;
    let boxPieChart = null;

    document.getElementById('startBtn').addEventListener('click', () => {
        // UI 반응성을 위해 setTimeout을 사용하여 렌더링 스레드 분리
        const btn = document.getElementById('startBtn');
        btn.disabled = true;
        btn.innerText = '연산 중...';
        setTimeout(runSimulation, 50); 
    });

    function runSimulation() {
        const N = parseInt(document.getElementById('N').value);
        const m = parseInt(document.getElementById('m').value);
        const trials = parseInt(document.getElementById('trials').value);
        
        const redCounts = new Array(m + 1).fill(0);
        let evenRedCount = 0;
        let lastBoxK = 0;
        let lastDraws = [];

        // 1. 몬테카를로 시뮬레이션 연산 (백그라운드에서 빠르게 실행)
        for (let i = 0; i < trials; i++) {
            const k = Math.floor(Math.random() * N) + 1;
            const probRed = k / N;
            let redInThisTrial = 0;
            let currentDraws = [];
            
            for (let j = 0; j < m; j++) {
                const isRed = Math.random() < probRed;
                if (isRed) redInThisTrial++;
                if (i === trials - 1) currentDraws.push(isRed ? 'red' : 'blue');
            }
            
            redCounts[redInThisTrial]++;
            if (redInThisTrial % 2 === 0) evenRedCount++;
            
            if (i === trials - 1) {
                lastBoxK = k;
                lastDraws = currentDraws;
            }
        }

        const expProbEven = evenRedCount / trials;

        // 2. 현재 N에 대한 정확한 이론적 확률 계산
        let exactProbN = 0.5;
        let sum = 0;
        for(let k = 1; k <= N; k++) {
            sum += Math.pow(1 - (2 * k) / N, m);
        }
        exactProbN += sum / (2 * N);

        // 3. N -> 무한대 극한값 계산
        let theoLimit = 0.5;
        let limitText = "홀수";
        if (m % 2 === 0) {
            theoLimit = 0.5 + (1 / (2 * (m + 1)));
            limitText = "짝수";
        }

        // UI 업데이트
        updateTextResults(N, m, expProbEven, exactProbN, theoLimit, limitText);
        updateCharts(m, redCounts, expProbEven, exactProbN, theoLimit);
        updateLastTrialUI(lastBoxK, N, lastDraws);

        const btn = document.getElementById('startBtn');
        btn.disabled = false;
        btn.innerText = '실험 시작';
    }

    function updateTextResults(N, m, exp, exact, limit, limitText) {
        const div = document.getElementById('textResult');
        div.style.display = 'block';
        
        let html = `추출 횟수 m = ${m} 은(는) <span class="highlight">${limitText}</span>입니다.<br>`;
        if (limitText === "홀수") {
            html += `따라서 극한값은 m값과 무관하게 <strong>0.5 (1/2)</strong>로 수렴합니다.<br><br>`;
        } else {
            html += `따라서 극한값은 1/2 + 1/(2(m+1)) 식에 의해 <strong>${limit.toFixed(4)}</strong> 로 수렴합니다.<br><br>`;
        }
        
        html += `• <strong>시뮬레이션 확률:</strong> ${(exp * 100).toFixed(2)}%<br>`;
        html += `• <strong>이론적 확률 (N=${N}):</strong> ${(exact * 100).toFixed(2)}%<br>`;
        html += `• <strong>극한값 (N→∞):</strong> ${(limit * 100).toFixed(2)}%`;
        
        div.innerHTML = html;
    }

    function updateCharts(m, counts, expProb, exactProb, theoLimit) {
        const labels = Array.from({length: m + 1}, (_, i) => `${i}번`);
        const bgColors = labels.map((_, i) => i % 2 === 0 ? 'rgba(241, 196, 15, 0.8)' : 'rgba(52, 152, 219, 0.4)');
        const borderColors = labels.map((_, i) => i % 2 === 0 ? 'rgba(243, 156, 18, 1)' : 'rgba(41, 128, 185, 1)');

        // 분포 차트 (짝수 강조)
        if (distChart) distChart.destroy();
        distChart = new Chart(document.getElementById('distChart').getContext('2d'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: '빨간 공 출현 빈도 (노란색: 짝수)',
                    data: counts,
                    backgroundColor: bgColors,
                    borderColor: borderColors,
                    borderWidth: 2,
                    borderRadius: 4
                }]
            },
            options: { maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
        });

        // 비교 차트
        if (compareChart) compareChart.destroy();
        compareChart = new Chart(document.getElementById('compareChart').getContext('2d'), {
            type: 'bar',
            data: {
                labels: ['시뮬레이션 결과', `이론적 확률(N=${document.getElementById('N').value})`, '극한값(N→∞)'],
                datasets: [{
                    label: '빨간 공 짝수 확률',
                    data: [expProb, exactProb, theoLimit],
                    backgroundColor: ['#2ecc71', '#9b59b6', '#e74c3c'],
                    borderWidth: 0,
                    borderRadius: 4
                }]
            },
            options: { 
                maintainAspectRatio: false, 
                scales: { y: { beginAtZero: true, max: Math.max(0.6, theoLimit + 0.1) } },
                plugins: {
                    legend: { display: false },
                    tooltip: { callbacks: { label: function(c) { return c.parsed.y.toFixed(4); } } }
                }
            }
        });
    }

    async function updateLastTrialUI(k, N, draws) {
        // 파이 차트 업데이트 (상자 구성 비율)
        if (boxPieChart) boxPieChart.destroy();
        boxPieChart = new Chart(document.getElementById('boxPieChart').getContext('2d'), {
            type: 'pie',
            data: {
                labels: ['빨간 공', '파란 공'],
                datasets: [{
                    data: [k, N - k],
                    backgroundColor: ['#ff7675', '#74b9ff'],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    title: { display: true, text: `선택된 ${k}번 상자` }
                }
            }
        });

        // 공 뽑기 애니메이션
        const container = document.getElementById('ballsContainer');
        container.innerHTML = '';
        
        for (let i = 0; i < draws.length; i++) {
            await new Promise(resolve => setTimeout(resolve, 150)); 
            const ball = document.createElement('div');
            ball.className = `ball ${draws[i]}`;
            ball.innerText = i + 1;
            container.appendChild(ball);
            setTimeout(() => ball.classList.add('show'), 20);
        }
    }
</script>

</body>
</html>
