<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>세 원 위를 움직이는 점 A, B, C 시뮬레이터</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .wrap {
      max-width: 1080px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .notice {
      font-size: 14px;
      color: #555;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .main {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      align-items: start;
    }

    canvas {
      width: 100%;
      max-width: 720px;
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    .panel {
      background: #fafafa;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      min-height: 650px;
    }

    .panel h2 {
      font-size: 18px;
      margin: 14px 0 8px;
    }

    .panel h2:first-child {
      margin-top: 0;
    }

    .info {
      line-height: 1.75;
      font-size: 14px;
      white-space: pre-line;
    }

    .recordBox {
      max-height: 230px;
      overflow-y: auto;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.6;
    }

    .record {
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px dashed #ccc;
    }

    .record:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    input[type="range"] {
      width: 420px;
      max-width: 100%;
    }

    button {
      border: none;
      background: #222;
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #444;
    }

    .reset {
      background: #666;
    }

    .small {
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>세 원 위를 움직이는 점 A, B, C</h1>
    <div class="notice">
      원 X의 중심은 (0, 1), 반지름은 2입니다. 따라서 A의 출발점은 (0, 3)이 됩니다. 원 Y, Z의 반지름은 각각 1입니다.
    </div>

    <div class="main">
      <canvas id="canvas" width="720" height="680"></canvas>

      <div class="panel">
        <h2>현재 위치</h2>
        <div id="info" class="info"></div>

        <h2>삼각형 ABC의 넓이</h2>
        <div id="areaInfo" class="info"></div>

        <h2>일직선 순간 기록</h2>
        <div id="recordBox" class="recordBox">아직 기록된 순간이 없습니다.</div>

        <h2>최대 넓이 순간</h2>
        <div id="maxInfo" class="info"></div>
      </div>
    </div>

    <div class="controls">
      <button id="playBtn">자동 재생</button>
      <button id="resetBtn" class="reset">초기화</button>
      <input id="slider" type="range" min="0" max="6283" value="0" />
      <span id="tValue" class="small">t = 0.000</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const slider = document.getElementById("slider");
    const playBtn = document.getElementById("playBtn");
    const resetBtn = document.getElementById("resetBtn");
    const info = document.getElementById("info");
    const areaInfo = document.getElementById("areaInfo");
    const recordBox = document.getElementById("recordBox");
    const maxInfo = document.getElementById("maxInfo");
    const tValue = document.getElementById("tValue");

    const W = canvas.width;
    const H = canvas.height;
    const scale = 110;
    const origin = { x: W / 2, y: H / 2 + 70 };
    const TWO_PI = Math.PI * 2;

    const specialMoments = [
      { key: "pi", label: "θ = π", theta: Math.PI },
      { key: "3pi2", label: "θ = 3π/2", theta: Math.PI * 1.5 }
    ];

    const maxMoment = {
      key: "max",
      label: "θ = π/4",
      theta: Math.PI / 4,
      area: 1.5 + Math.SQRT2
    };

    let playing = false;
    let animationId = null;
    let previousT = 0;
    let foundCollinear = new Set();
    let collinearRecords = [];
    let showMaxMarkers = false;

    function toCanvas(p) {
      return {
        x: origin.x + p.x * scale,
        y: origin.y - p.y * scale
      };
    }

    function drawLine(p1, p2, color = "#222", width = 2) {
      const a = toCanvas(p1);
      const b = toCanvas(p2);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.stroke();
    }

    function drawCircle(center, r, label, color) {
      const c = toCanvas(center);
      ctx.beginPath();
      ctx.arc(c.x, c.y, r * scale, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.fillStyle = color;
      ctx.font = "bold 18px Arial";
      ctx.fillText(label, c.x + r * scale + 8, c.y - 8);

      ctx.beginPath();
      ctx.arc(c.x, c.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPoint(p, label, color, radius = 7) {
      const c = toCanvas(p);
      ctx.beginPath();
      ctx.arc(c.x, c.y, radius, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      ctx.fillStyle = color;
      ctx.font = "bold 18px Arial";
      ctx.fillText(label, c.x + 10, c.y - 10);
    }

    function drawMarkedPoint(p, label) {
      const c = toCanvas(p);
      ctx.beginPath();
      ctx.arc(c.x, c.y, 11, 0, Math.PI * 2);
      ctx.fillStyle = "#111";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(c.x, c.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = "white";
      ctx.fill();
      ctx.fillStyle = "#111";
      ctx.font = "bold 15px Arial";
      ctx.fillText(label, c.x + 12, c.y + 5);
    }

    function drawAxes() {
      ctx.clearRect(0, 0, W, H);

      for (let x = -4; x <= 4; x++) {
        drawLine({ x, y: -2.5 }, { x, y: 4 }, "#e6e6e6", 1);
      }
      for (let y = -2; y <= 4; y++) {
        drawLine({ x: -4, y }, { x: 4, y }, "#e6e6e6", 1);
      }

      drawLine({ x: -4, y: 0 }, { x: 4, y: 0 }, "#222", 2);
      drawLine({ x: 0, y: -2.5 }, { x: 0, y: 4 }, "#222", 2);

      ctx.fillStyle = "#222";
      ctx.font = "14px Arial";
      for (let x = -3; x <= 3; x++) {
        if (x !== 0) {
          const p = toCanvas({ x, y: 0 });
          ctx.fillText(x, p.x - 4, p.y + 18);
        }
      }
      for (let y = -2; y <= 4; y++) {
        if (y !== 0) {
          const p = toCanvas({ x: 0, y });
          ctx.fillText(y, p.x + 8, p.y + 4);
        }
      }

      ctx.fillText("x", toCanvas({ x: 4, y: 0 }).x - 15, toCanvas({ x: 4, y: 0 }).y - 10);
      ctx.fillText("y", toCanvas({ x: 0, y: 4 }).x + 10, toCanvas({ x: 0, y: 4 }).y + 15);
    }

    function getPositions(t) {
      const A = {
        x: 2 * Math.sin(t),
        y: 1 + 2 * Math.cos(t)
      };

      const B = {
        x: 1 + Math.sin(t),
        y: Math.cos(t)
      };

      const C = {
        x: -1 - Math.sin(t),
        y: Math.cos(t)
      };

      return { A, B, C };
    }

    function getArea(t) {
      const { A, B, C } = getPositions(t);
      return Math.abs(
        (A.x * (B.y - C.y) + B.x * (C.y - A.y) + C.x * (A.y - B.y)) / 2
      );
    }

    function formatPoint(p) {
      return `(${p.x.toFixed(3)}, ${p.y.toFixed(3)})`;
    }

    function crossedMoment(prev, now, target) {
      if (now < prev) {
        return target > prev || target <= now;
      }
      return prev < target && target <= now;
    }

    function recordCollinear(moment) {
      if (foundCollinear.has(moment.key)) return;

      foundCollinear.add(moment.key);
      const { A, B, C } = getPositions(moment.theta);
      collinearRecords.push({
        label: moment.label,
        theta: moment.theta,
        A, B, C
      });

      updateRecordBox();
    }

    function updateRecordBox() {
      if (collinearRecords.length === 0) {
        recordBox.textContent = "아직 기록된 순간이 없습니다.";
        return;
      }

      recordBox.innerHTML = collinearRecords.map((r, i) => `
        <div class="record">
          <b>${i + 1}. ${r.label}</b><br>
          t = ${r.theta.toFixed(3)} rad<br>
          A = ${formatPoint(r.A)}<br>
          B = ${formatPoint(r.B)}<br>
          C = ${formatPoint(r.C)}
        </div>
      `).join("");
    }

    function drawStoredMarkers() {
      collinearRecords.forEach((r) => {
        drawMarkedPoint(r.A, "일직선 A");
        drawMarkedPoint(r.B, "일직선 B");
        drawMarkedPoint(r.C, "일직선 C");
      });

      if (showMaxMarkers) {
        const { A, B, C } = getPositions(maxMoment.theta);
        drawMarkedPoint(A, "최대 A");
        drawMarkedPoint(B, "최대 B");
        drawMarkedPoint(C, "최대 C");
      }
    }

    function checkSpecialMoments(t) {
      specialMoments.forEach((m) => {
        if (crossedMoment(previousT, t, m.theta)) {
          recordCollinear(m);
        }
      });

      if (!showMaxMarkers && crossedMoment(previousT, t, maxMoment.theta)) {
        showMaxMarkers = true;
      }

      previousT = t;
    }

    function draw(t, check = true) {
      if (check) checkSpecialMoments(t);

      drawAxes();

      drawCircle({ x: 0, y: 1 }, 2, "X", "#2b6cb0");
      drawCircle({ x: 1, y: 0 }, 1, "Y", "#2f855a");
      drawCircle({ x: -1, y: 0 }, 1, "Z", "#c53030");

      const { A, B, C } = getPositions(t);

      drawLine(A, B, "#555", 2.5);
      drawLine(B, C, "#555", 2.5);
      drawLine(C, A, "#555", 2.5);

      drawStoredMarkers();

      drawPoint(A, "A", "#2b6cb0");
      drawPoint(B, "B", "#2f855a");
      drawPoint(C, "C", "#c53030");

      const area = getArea(t);
      const { A: maxA, B: maxB, C: maxC } = getPositions(maxMoment.theta);

      info.textContent =
        `t = ${t.toFixed(3)} rad

` +
        `A = ${formatPoint(A)}
` +
        `B = ${formatPoint(B)}
` +
        `C = ${formatPoint(C)}

` +
        `A: 원 X 위, 시계방향
` +
        `B: 원 Y 위, 시계방향
` +
        `C: 원 Z 위, 반시계방향`;

      areaInfo.textContent =
        `현재 넓이 ≈ ${area.toFixed(4)}
` +
        `넓이 공식: |(1 + sin t)(1 + cos t)|`;

      maxInfo.textContent =
        `최대 넓이: ${maxMoment.area.toFixed(4)}
` +
        `최대가 되는 순간: ${maxMoment.label}
` +
        `A = ${formatPoint(maxA)}
` +
        `B = ${formatPoint(maxB)}
` +
        `C = ${formatPoint(maxC)}

` +
        (showMaxMarkers ? `그림에 최대 넓이 순간의 점을 표시했습니다.` : `아직 최대 넓이 순간을 지나지 않았습니다.`);

      tValue.textContent = `t = ${t.toFixed(3)}`;
    }

    slider.addEventListener("input", () => {
      const t = Number(slider.value) / 1000;
      draw(t);
    });

    playBtn.addEventListener("click", () => {
      playing = !playing;
      playBtn.textContent = playing ? "정지" : "자동 재생";

      if (playing) {
        animate();
      } else {
        cancelAnimationFrame(animationId);
      }
    });

    resetBtn.addEventListener("click", () => {
      playing = false;
      cancelAnimationFrame(animationId);
      playBtn.textContent = "자동 재생";
      slider.value = 0;
      previousT = 0;
      foundCollinear = new Set();
      collinearRecords = [];
      showMaxMarkers = false;
      updateRecordBox();
      draw(0, false);
    });

    function animate() {
      let value = Number(slider.value);
      value += 12;

      if (value > 6283) {
        value = 0;
      }

      slider.value = value;
      draw(value / 1000);

      if (playing) {
        animationId = requestAnimationFrame(animate);
      }
    }

    draw(0, false);
  </script>
</body>
</html>
