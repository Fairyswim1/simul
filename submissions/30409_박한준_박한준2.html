<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D 수학 시뮬레이터: 초월함수의 개형과 단조 증가 조건</title>
    <style>
        /* 배경 및 화면 중앙 정렬 */
        body { 
            margin: 0; 
            padding: 0;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background-color: #cbd5e1; 
            font-family: 'Malgun Gothic', sans-serif; 
        }
        
        /* 시뮬레이터 메인 컨테이너 (액자형 프레임) */
        #app-container {
            position: relative;
            width: 90vw;
            max-width: 1400px;
            height: 85vh;
            max-height: 850px;
            background-color: #f8fafc;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            border: 1px solid #94a3b8;
        }

        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }

        /* 좌측 제어 패널 */
        #ui-panel {
            position: absolute;
            top: 25px;
            left: 25px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.15);
            width: 320px;
            z-index: 10;
        }
        h2 { margin-top: 0; font-size: 16px; color: #1e293b; line-height: 1.4; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .control-group { margin-top: 15px; margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #475569; font-size: 14px; }
        input[type="range"] { width: 100%; cursor: pointer; }
        .data-box { background: #f1f5f9; padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.6; }
        .status-badge {
            margin-top: 8px;
            padding: 6px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 13px;
        }
        .increasing { background-color: #dcfce7; color: #15803d; }
        .has-extrema { background-color: #fee2e2; color: #b91c1c; }
        .formula { font-style: italic; font-family: 'Times New Roman', serif; background: #e2e8f0; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="ui-panel">
        <h2>초월함수 그래프 시뮬레이터</h2>
        <div class="formula">f(x) = x + r / √(1 + sin²x)</div>
        
        <div class="control-group">
            <label for="rSlider">매개변수 (r): <span id="rValue" style="color:#2563eb; font-size:16px;">1.00</span></label>
            <input type="range" id="rSlider" min="-10" max="20" step="0.05" value="1.00">
        </div>
        
        <div class="data-box">
            <div><strong>증가함수 임계값:</strong><br>-3.224 ≤ r ≤ 3.224</div>
            <hr style="border:0; border-top:1px solid #cbd5e1; margin:8px 0;">
            <div id="statusBadge" class="status-badge increasing">단조 증가 함수 상태</div>
        </div>
    </div>

    <canvas id="graphCanvas"></canvas>
</div>

<script>
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('app-container');
    
    const rSlider = document.getElementById('rSlider');
    const rValue = document.getElementById('rValue');
    const statusBadge = document.getElementById('statusBadge');

    let xMin, xMax, yMin, yMax;

    function resizeCanvas() {
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;

        const requiredRange = 30; 
        
        const scaleX = canvas.width / requiredRange;
        const scaleY = canvas.height / requiredRange;
        const scale = Math.min(scaleX, scaleY); 

        const actualXRange = canvas.width / scale;
        const actualYRange = canvas.height / scale;

        xMin = 5 - actualXRange / 2;
        xMax = 5 + actualXRange / 2;
        
        yMin = 5 - actualYRange / 2;
        yMax = 5 + actualYRange / 2;

        drawGraph();
    }

    function toScreenX(x) { return ((x - xMin) / (xMax - xMin)) * canvas.width; }
    function toScreenY(y) { return canvas.height - ((y - yMin) / (yMax - yMin)) * canvas.height; }

    function f(x, r) { return x + r / Math.sqrt(1 + Math.pow(Math.sin(x), 2)); }

    function drawGraph() {
        const width = canvas.width;
        const height = canvas.height;
        const r = parseFloat(rSlider.value);

        ctx.clearRect(0, 0, width, height);

        // --- 1. 축 및 그리드 렌더링 ---
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        for (let x = Math.ceil(xMin); x <= Math.floor(xMax); x++) {
            let sx = toScreenX(x);
            ctx.beginPath();
            if (x === 0) {
                ctx.strokeStyle = '#64748b'; 
                ctx.lineWidth = 2;
            } else {
                ctx.strokeStyle = '#e2e8f0'; 
                ctx.lineWidth = 1;
            }
            ctx.moveTo(sx, 0); ctx.lineTo(sx, height); ctx.stroke();
            
            if (x !== 0 && x % 2 === 0) {
                ctx.fillStyle = '#475569';
                ctx.fillText(x, sx, toScreenY(0) + 14);
            }
        }

        for (let y = Math.ceil(yMin); y <= Math.floor(yMax); y++) {
            let sy = toScreenY(y);
            ctx.beginPath();
            if (y === 0) {
                ctx.strokeStyle = '#64748b'; 
                ctx.lineWidth = 2;
            } else {
                ctx.strokeStyle = '#e2e8f0'; 
                ctx.lineWidth = 1;
            }
            ctx.moveTo(0, sy); ctx.lineTo(width, sy); ctx.stroke();

            if (y !== 0 && y % 2 === 0) {
                ctx.fillStyle = '#475569';
                ctx.fillText(y, toScreenX(0) - 14, sy);
            }
        }
        ctx.fillText('0', toScreenX(0) - 10, toScreenY(0) + 14);

        // --- 2. y = x 기준선 렌더링 ---
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(toScreenX(xMin), toScreenY(xMin));
        ctx.lineTo(toScreenX(xMax), toScreenY(xMax));
        ctx.stroke();
        ctx.setLineDash([]); 

        // --- 3. 함수 f(x) 렌더링 ---
        ctx.strokeStyle = '#2563eb';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        
        let isFirst = true;
        const step = (xMax - xMin) / width; 
        
        for (let x = xMin; x <= xMax; x += step) {
            let y = f(x, r);
            let sx = toScreenX(x);
            let sy = toScreenY(y);

            if (sy >= -50 && sy <= height + 50) { 
                if (isFirst) {
                    ctx.moveTo(sx, sy);
                    isFirst = false;
                } else {
                    ctx.lineTo(sx, sy);
                }
            } else {
                isFirst = true;
            }
        }
        ctx.stroke();

        // --- 4. 데이터 및 수학 상태 업데이트 ---
        rValue.textContent = r.toFixed(2);
        
        // 절댓값(Math.abs)을 적용하여 음수 영역 임계값도 커버
        if (Math.abs(r) <= 3.2237) {
            statusBadge.textContent = "✓ 현재 상태: 단조 증가 함수";
            statusBadge.className = "status-badge increasing";
        } else {
            statusBadge.textContent = "⚠ 현재 상태: 극값 및 감소 구간 존재";
            statusBadge.className = "status-badge has-extrema";
        }
    }

    rSlider.addEventListener('input', drawGraph);
    window.addEventListener('resize', resizeCanvas);

    resizeCanvas();
</script>
</body>
</html>
