<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학 시뮬레이터: S(a) 최적화 대시보드</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #4da3ff;
            --success: #00ff88;
            --error: #ff5555;
            --text: #e0e0e0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            width: 100%;
        }

        /* 왼쪽: 시뮬레이터 섹션 */
        .simulator-section {
            flex: 2;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        canvas {
            width: 100%;
            background: #000;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .controls {
            margin-top: 20px;
            padding: 20px;
            background: #252525;
            border-radius: 12px;
        }

        .slider-group {
            margin-bottom: 15px;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #444;
            outline: none;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .stat-item {
            flex: 1;
            padding: 10px;
            background: #333;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label { font-size: 12px; color: #888; }
        .stat-value { font-size: 20px; font-weight: bold; }

        /* 오른쪽: 인사이트 섹션 */
        .insight-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .insight-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            border-left: 4px solid var(--primary);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .insight-card h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: var(--primary);
        }

        .insight-card p {
            margin: 0;
            font-size: 14px;
            line-height: 1.6;
            color: #bbb;
        }

        .optimal-mode .insight-card {
            border-left-color: var(--success);
        }

        .highlight { color: #fff; font-weight: bold; }

        @media (max-width: 900px) {
            .dashboard { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="dashboard" id="mainDashboard">
    <div class="simulator-section">
        <h2 style="margin-top:0">면적 S(a) 시각화</h2>
        <canvas id="graphCanvas"></canvas>
        
        <div class="controls">
            <div class="slider-group">
                <label>직선 y = a 조정</label>
                <input type="range" id="aSlider" min="1.80" max="2.40" step="0.001" value="2.20">
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">파라미터 a</div>
                    <div id="aDisplay" class="stat-value">2.200</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">면적 S(a)</div>
                    <div id="sDisplay" class="stat-value">---</div>
                </div>
            </div>
        </div>
    </div>

    <div class="insight-section">
        <div class="insight-card">
            <h3>1. 함수 변환</h3>
            <p>부등식을 정리하면 <span class="highlight">y = (x ln 2)/ln x</span> 곡선과 직선 <span class="highlight">y = a</span> 사이의 영역이 됩니다.</p>
        </div>
        <div class="insight-card">
            <h3>2. 기하학적 힌트</h3>
            <p>곡선은 (2, 2)와 (4, 2)를 지납니다. <span class="highlight">a = 2</span>일 때 직선이 이 점들을 관통하며 대칭 구조를 형성합니다.</p>
        </div>
        <div class="insight-card">
            <h3>3. 최소화 원리</h3>
            <p>절댓값 적분 <code>∫|f(x)-a|dx</code>의 최소값은 a가 f(x)의 <span class="highlight">중앙값</span>일 때 발생합니다. 2.0 부근에서 색이 변하는지 확인하세요!</p>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    const aSlider = document.getElementById('aSlider');
    const aDisplay = document.getElementById('aDisplay');
    const sDisplay = document.getElementById('sDisplay');
    const dashboard = document.getElementById('mainDashboard');

    // 캔버스 크기 설정
    function resize() {
        canvas.width = canvas.offsetWidth * 2;
        canvas.height = 400 * 2;
        ctx.scale(2, 2);
    }
    window.addEventListener('resize', resize);
    resize();

    const xMin = 1.8, xMax = 6.2;
    const yMin = 1.7, yMax = 2.4;
    const padding = 50;
    const graphW = canvas.offsetWidth - padding * 2;
    const graphH = 400 - padding * 2;

    const f = (x) => (x * Math.log(2)) / Math.log(x);

    function toCX(x) { return padding + (x - xMin) / (xMax - xMin) * graphW; }
    function toCY(y) { return (400 - padding) - (y - yMin) / (yMax - yMin) * graphH; }

    function draw() {
        const a = parseFloat(aSlider.value);
        const isOptimal = Math.abs(a - 2.0) < 0.01;
        
        // 상태 업데이트
        aDisplay.innerText = a.toFixed(3);
        if(isOptimal) {
            dashboard.classList.add('optimal-mode');
            aDisplay.style.color = '#00ff88';
        } else {
            dashboard.classList.remove('optimal-mode');
            aDisplay.style.color = '#4da3ff';
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 축 그리기
        ctx.strokeStyle = '#444';
        ctx.beginPath();
        ctx.moveTo(toCX(2), toCY(yMin)); ctx.lineTo(toCX(2), toCY(yMax));
        ctx.moveTo(toCX(xMin), toCY(2)); ctx.lineTo(toCX(xMax), toCY(2));
        ctx.stroke();

        // 면적 적분 및 채우기
        let area = 0;
        const step = 0.01;
        ctx.fillStyle = isOptimal ? 'rgba(0, 255, 136, 0.4)' : 'rgba(255, 85, 85, 0.2)';
        ctx.beginPath();
        ctx.moveTo(toCX(2), toCY(a));
        for(let x = 2; x <= 6; x += step) {
            const y = f(x);
            ctx.lineTo(toCX(x), toCY(y));
            area += Math.abs(y - a) * step;
        }
        ctx.lineTo(toCX(6), toCY(a));
        ctx.closePath();
        ctx.fill();
        sDisplay.innerText = area.toFixed(4);

        // f(x) 곡선
        ctx.strokeStyle = '#4da3ff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        for(let x = 2; x <= 6; x += step) {
            if(x === 2) ctx.moveTo(toCX(x), toCY(f(x)));
            else ctx.lineTo(toCX(x), toCY(f(x)));
        }
        ctx.stroke();

        // 직선 y = a
        ctx.strokeStyle = isOptimal ? '#00ff88' : '#ff5555';
        ctx.setLineDash(isOptimal ? [] : [5, 5]);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(toCX(xMin), toCY(a)); ctx.lineTo(toCX(xMax), toCY(a));
        ctx.stroke();
        ctx.setLineDash([]);

        // 특수 포인트
        if(isOptimal) {
            ctx.fillStyle = '#00ff88';
            [2, 4].forEach(px => {
                ctx.beginPath();
                ctx.arc(toCX(px), toCY(2), 5, 0, Math.PI*2);
                ctx.fill();
            });
        }
    }

    aSlider.addEventListener('input', draw);
    draw(); // 초기 실행
</script>

</body>
</html>
