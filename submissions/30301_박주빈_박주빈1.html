<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Recurrence Solver & Visualizer Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'JetBrains Mono', monospace; background: #6983af; color: #0f3b08; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1200px; background: #cfcca9; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        h2 { font-family: 'Orbitron', sans-serif; color: #07214f; text-align: center; margin-top: 0; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        
        .main-layout { display: grid; grid-template-columns: 450px 1fr; gap: 25px; align-items: start; }
        
        .setup-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px; }
        .input-card { background: rgba(0,0,0,0.05); padding: 15px; border-radius: 12px; }
        .input-group { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        label { font-size: 0.9rem; font-weight: 700; color: #07214f; min-width: 35px; }
        input { font-family: 'JetBrains Mono'; background: #87a6db; border: 1px solid #13408f; padding: 8px; border-radius: 5px; color: #07214f; width: 70px; text-align: center; font-weight: bold; }
        
        button { font-family: 'Orbitron', sans-serif; width: 100%; padding: 15px; background: #07214f; color: #fff; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; font-size: 1.1rem; transition: 0.3s; margin-bottom: 20px; }
        button:hover { background: #13408f; transform: translateY(-2px); }
        
        .result-section { display: grid; gap: 15px; }
        .box { background: #07214f; color: #cfcca9; padding: 18px; border-radius: 10px; border-left: 5px solid #87a6db; }
        .label-tag { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; color: #87a6db; margin-bottom: 8px; display: block; font-weight: bold; }
        
        #generalTerm { font-size: 0.95rem; text-align: left; color: #fff; font-weight: bold; line-height: 1.8; word-break: break-all; }
        .highlight { color: #3ae81f; }

        .viz-container { background: #07214f; border-radius: 15px; padding: 20px; display: flex; flex-direction: column; overflow: hidden; }
        canvas { width: 100%; height: 450px; background: #0a1931; border-radius: 10px; display: block; }
        .viz-info { color: #87a6db; font-size: 0.8rem; margin-top: 10px; text-align: center; font-family: 'Orbitron'; }
    </style>
</head>
<body>

<div class="container">
    <h2>Recurrence Analyzer</h2>
    
    <div class="main-layout">
        <div class="control-panel">
            <div class="setup-grid">
                <div class="input-card">
                    <span class="label-tag">Recurrence Relation</span>
                    <p style="font-size: 0.75rem; color:#07214f; margin: 0 0 10px 0;">p·aₙ₊₂ + q·aₙ₊₁ + r·aₙ = 0</p>
                    <div class="input-group">
                        <label>p:</label><input type="number" id="p" value="1">
                        <label>q:</label><input type="number" id="q" value="-1">
                        <label>r:</label><input type="number" id="r" value="-1">
                    </div>
                </div>
                <div class="input-card">
                    <span class="label-tag">Initial Conditions</span>
                    <div class="input-group"><label>a₁:</label><input type="number" id="a1" value="1"></div>
                    <div class="input-group"><label>a₂:</label><input type="number" id="a2" value="1"></div>
                </div>
            </div>
            
            <button onclick="solve()">SOLVE & VISUALIZE</button>

            <div class="result-section">
                <div class="box"><span class="label-tag">Equation</span><div id="charEq"></div></div>
                <div class="box"><span class="label-tag">Roots (α, β)</span><div id="roots"></div></div>
                <div class="box"><span class="label-tag">General Term aₙ</span><div id="generalTerm">...</div></div>
            </div>
        </div>

        <div class="viz-container">
            <span class="label-tag" style="color: #fff;">Sequence Trend Visualization</span>
            <canvas id="seqChart"></canvas>
            <div class="viz-info">Displaying first 15 terms of the sequence</div>
        </div>
    </div>
</div>

<script>
const gcd = (a, b) => b === 0 ? Math.abs(a) : gcd(b, a % b);

function simplifyRad(d) {
    let out = 1, inside = d;
    for (let i = Math.floor(Math.sqrt(d)); i >= 2; i--) {
        if (inside % (i * i) === 0) { out *= i; inside /= (i * i); break; }
    }
    if (out > 1) { const res = simplifyRad(inside); out *= res.out; inside = res.inside; }
    return { out, inside };
}

function solve() {
    const p = parseInt(document.getElementById('p').value);
    const q = parseInt(document.getElementById('q').value);
    const r = parseInt(document.getElementById('r').value);
    const a1 = parseInt(document.getElementById('a1').value);
    const a2 = parseInt(document.getElementById('a2').value);

    document.getElementById('charEq').innerText = `${p}x² ${q >= 0 ? '+' : ''}${q}x ${r >= 0 ? '+' : ''}${r} = 0`;

    const D = q * q - 4 * p * r;
    const denom = 2 * p;
    let sequence = [a1, a2];

    if (D > 0) {
        const s = simplifyRad(D);
        const radStr = s.inside === 1 ? `${s.out}` : (s.out === 1 ? "" : s.out) + "√" + s.inside;
        const alphaStr = s.inside === 1 ? `${(-q + s.out) / denom}` : `(${ -q } + ${ radStr })/${ denom }`;
        const betaStr = s.inside === 1 ? `${(-q - s.out) / denom}` : `(${ -q } - ${ radStr })/${ denom }`;
        document.getElementById('roots').innerHTML = `α = <span class="highlight">${alphaStr}</span>, β = <span class="highlight">${betaStr}</span>`;

        const numer_constant = 2 * p * a2 + a1 * q;
        const numer_rad_coeff = a1 * s.out;
        let A_expr, B_expr;

        if (s.inside === 1) {
            const final_A_num = numer_constant + numer_rad_coeff;
            const final_A_den = 2 * s.out;
            const commonA = gcd(final_A_num, final_A_den);
            A_expr = final_A_den/commonA === 1 ? `${final_A_num/commonA}` : `(${final_A_num/commonA}/${final_A_den/commonA})`;
            const final_B_num = 2 * s.out * a1 - final_A_num;
            const commonB = gcd(final_B_num, final_A_den);
            B_expr = final_A_den/commonB === 1 ? `${final_B_num/commonB}` : `(${final_B_num/commonB}/${final_A_den/commonB})`;
        } else {
            const final_A_const = numer_rad_coeff * s.inside;
            const final_A_rad = numer_constant;
            const final_A_denom = 2 * s.out * s.inside;
            const final_B_const = a1 * final_A_denom - final_A_const;
            const final_B_rad = -final_A_rad;
            const formatTerm = (c, r, d, rs) => {
                const common = gcd(gcd(c, r), d);
                const fc = c/common, fr = r/common, fd = d/common;
                const rPart = fr === 0 ? "" : (Math.abs(fr) === 1 ? "" : Math.abs(fr)) + "√" + rs;
                let res = "";
                if(fc !== 0) res += fc;
                if(fr !== 0) res += (fr > 0 && fc !== 0 ? "+" : (fr < 0 ? "-" : "")) + rPart;
                return fd === 1 ? `(${res})` : `(${res})/${fd}`;
            };
            A_expr = formatTerm(final_A_const, final_A_rad, final_A_denom, s.inside);
            B_expr = formatTerm(final_B_const, final_B_rad, final_A_denom, s.inside);
        }
        document.getElementById('generalTerm').innerHTML = `aₙ = ${A_expr}·[${alphaStr}]ⁿ⁻¹ + ${B_expr}·[${betaStr}]ⁿ⁻¹`;
    } else if (D === 0) {
        const rootNum = -q, rootDen = 2 * p;
        const common = gcd(rootNum, rootDen);
        const rootStr = rootDen/common === 1 ? `${rootNum/common}` : `${rootNum/common}/${rootDen/common}`;
        const alpha = -q / (2 * p);
        const B_val = (a2 / alpha) - a1;
        document.getElementById('roots').innerText = `α = β = ${rootStr} (중근)`;
        document.getElementById('generalTerm').innerText = `aₙ = [(${a1}) + (${B_val.toFixed(2)})(n-1)] · (${rootStr})ⁿ⁻¹`;
    } else {
        document.getElementById('roots').innerText = "Complex Roots Not Supported";
    }

    for (let i = 2; i < 15; i++) {
        const nextVal = (-q * sequence[i - 1] - r * sequence[i - 2]) / p;
        sequence.push(nextVal);
    }
    drawChart(sequence);
}

function drawChart(data) {
    const canvas = document.getElementById('seqChart');
    const ctx = canvas.getContext('2d');
    const width = canvas.width = canvas.parentElement.clientWidth;
    const height = canvas.height = 450;
    
    ctx.clearRect(0, 0, width, height);
    
    const padding = 70; // 여백 대폭 확장 (라벨 잘림 방지)
    const chartW = width - padding * 2;
    const chartH = height - padding * 2;
    
    const absData = data.map(Math.abs);
    const maxVal = Math.max(...absData, 1e-10);
    
    const getX = (i) => padding + (i * (chartW / (data.length - 1)));
    const getY = (v) => {
        // 데이터가 캔버스 상하단 끝에 붙지 않도록 계수 조절 (0.4)
        return (height / 2) - (v / maxVal) * (chartH * 0.45);
    };

    // 0선 가이드
    ctx.strokeStyle = 'rgba(135, 166, 219, 0.2)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(padding, height/2);
    ctx.lineTo(width-padding, height/2);
    ctx.stroke();
    ctx.setLineDash([]);

    // 그래프 선
    ctx.beginPath();
    ctx.strokeStyle = '#3ae81f';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    data.forEach((v, i) => {
        if(i === 0) ctx.moveTo(getX(i), getY(v));
        else ctx.lineTo(getX(i), getY(v));
    });
    ctx.stroke();

    // 점 및 값 표시
    data.forEach((v, i) => {
        const x = getX(i);
        const y = getY(v);
        
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#07214f';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        ctx.textAlign = 'center';
        ctx.font = 'bold 11px JetBrains Mono';
        
        // 항 번호 (하단 고정)
        ctx.fillStyle = '#87a6db';
        ctx.fillText(`a${i+1}`, x, height - 25);
        
        // 데이터 값 (지수 표기 및 위치 자동 조정)
        ctx.fillStyle = '#3ae81f';
        let displayVal = Math.abs(v) > 9999 ? v.toExponential(1) : v.toFixed(1);
        
        // 천장에 닿으면 텍스트를 아래로 보냄
        const textOffset = y < 50 ? 20 : -15;
        ctx.fillText(displayVal, x, y + textOffset);
    });
}

window.onload = solve;
</script>
</body>
</html>
