<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>KAIST 2024 기출 분석 시뮬레이터 - 최종본</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h2 { color: #1e293b; margin-bottom: 5px; }
        .main-container { display: flex; gap: 20px; margin-top: 15px; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        canvas { background: #ffffff; border: 2px solid #cbd5e1; border-radius: 8px; }
        .side-panel { width: 320px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; }
        .card h3 { margin: 0 0 10px 0; font-size: 16px; color: #334155; border-bottom: 2px solid #cbd5e1; padding-bottom: 5px; }
        .data-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; }
        .data-val { font-weight: bold; font-family: monospace; }
        .control-bar { width: 100%; display: flex; align-items: center; gap: 15px; margin-top: 15px; justify-content: center; }
        input[type=range] { width: 450px; }
        button { background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        .alert-box { background: #fef2f2; border: 2px dashed #ef4444; color: #b91c1c; font-weight: bold; text-align: center; padding: 10px; border-radius: 6px; display: none; }
        .highlight-text { color: #0284c7; font-size: 18px; font-weight: bold; }
        .max-text { color: #b91c1c; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>2024학년도 KAIST 기출문제 4번 분석 시뮬레이터</h2>
    <p style="margin:0; color:#64748b;">조건 (1) 일직선 정렬 상태 실시간 감지 및 조건 (2) 넓이 최댓값 정밀 추적 시스템</p>

    <div class="main-container">
        <canvas id="mathCanvas" width="600" height="600"></canvas>
        
        <div class="side-panel">
            <div class="card">
                <h3>실시간 좌표 데이터</h3>
                <div class="data-row"><span>점 A (원 X):</span><span id="coordA" class="data-val" style="color:red;">(0.00, 0.00)</span></div>
                <div class="data-row"><span>점 B (원 Y):</span><span id="coordB" class="data-val" style="color:green;">(0.00, 0.00)</span></div>
                <div class="data-row"><span>점 C (원 Z):</span><span id="coordC" class="data-val" style="color:orange;">(0.00, 0.00)</span></div>
            </div>

            <div class="card">
                <h3>기하학적 상태 검토</h3>
                <div class="data-row"><span>현재 넓이 S(θ):</span><span id="currArea" class="highlight-text">0.0000</span></div>
                <div class="data-row"><span>추적된 최댓값:</span><span id="maxArea" class="max-text">0.0000</span></div>
                <p style="font-size:11px; color:#94a3b8; margin: 5px 0 0 0;">* 이론상 최댓값: 3/2 + √2 ≒ 2.9142</p>
            </div>

            <div id="alignAlert" class="alert-box">
                ★ 일직선 조건 충족! ★
                <div id="alignReason" style="font-size:12px; font-weight:normal; margin-top:5px;"></div>
            </div>
            
            <button id="resetMaxBtn" style="background:#64748b;">최댓값 추적 리셋</button>
        </div>
    </div>

    <div class="control-bar">
        <button id="playBtn">▶ 재생</button>
        <label for="thetaSlider" style="font-weight:bold;">t (θ): </label>
        <input type="range" id="thetaSlider" min="0" max="6.28318" step="0.005" value="0">
        <span id="thetaVal" style="font-family:monospace; font-weight:bold; width:40px; display:inline-block;">0.00</span> rad
    </div>

    <script>
        const canvas = document.getElementById('mathCanvas');
        const ctx = canvas.getContext('2d');

        const scale = 80;
        const centerX = 300;
        const centerY = 350;

        const slider = document.getElementById('thetaSlider');
        const thetaVal = document.getElementById('thetaVal');
        const playBtn = document.getElementById('playBtn');
        const resetMaxBtn = document.getElementById('resetMaxBtn');

        const coordA = document.getElementById('coordA');
        const coordB = document.getElementById('coordB');
        const coordC = document.getElementById('coordC');
        const currArea = document.getElementById('currArea');
        const maxAreaDisp = document.getElementById('maxArea');
        const alignAlert = document.getElementById('alignAlert');
        const alignReason = document.getElementById('alignReason');

        let maxAreaVal = 0;
        let isPlaying = false;
        let animationFrameId;

        function toCanvasX(mathX) { return centerX + mathX * scale; }
        function toCanvasY(mathY) { return centerY - mathY * scale; }

        function draw() {
            const theta = parseFloat(slider.value);
            thetaVal.innerText = theta.toFixed(2);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 좌표축 격자선
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, centerY); ctx.lineTo(canvas.width, centerY); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(centerX, 0); ctx.lineTo(centerX, canvas.height); ctx.stroke();

            // 2. 세 원 X, Y, Z 가이드선
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#cbd5e1';
            ctx.beginPath(); ctx.arc(toCanvasX(0), toCanvasY(1), 2 * scale, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(toCanvasX(1), toCanvasY(0), 1 * scale, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.arc(toCanvasX(-1), toCanvasY(0), 1 * scale, 0, Math.PI * 2); ctx.stroke();

            // 3. 동적 점 매개변수 계산
            const A = { x: 2 * Math.sin(theta), y: 1 + 2 * Math.cos(theta) };
            const B = { x: 1 + Math.sin(theta), y: Math.cos(theta) };
            const C = { x: -1 - Math.sin(theta), y: Math.cos(theta) };

            // 우측 패널 좌표 세팅
            coordA.innerText = `(${A.x.toFixed(2)}, ${A.y.toFixed(2)})`;
            coordB.innerText = `(${B.x.toFixed(2)}, ${B.y.toFixed(2)})`;
            coordC.innerText = `(${C.x.toFixed(2)}, ${C.y.toFixed(2)})`;

            // [핵심 보조선 인사이트]: 변 BC를 관통하는 평행 연장선 시각화
            ctx.strokeStyle = 'rgba(148, 163, 184, 0.4)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(0, toCanvasY(B.y));
            ctx.lineTo(canvas.width, toCanvasY(B.y));
            ctx.stroke();
            ctx.setLineDash([]); // 대시 초기화

            // 4. 기하학적 특이 조건 검사 (일직선 정렬 상태 판별)
            let isCollinear = false;
            let reason = "";

            // 케이스 A: B와 C가 겹치는 특이 지점 (θ ≒ 3π/2)
            if (Math.abs(B.x - C.x) < 0.03 && Math.abs(B.y - C.y) < 0.03) {
                isCollinear = true;
                reason = "점 B와 점 C가 원점(0,0)에서 완전히 포개어져 일직선이 정의됩니다. (θ = 3π/2)";
            } 
            // 케이스 B: 세 점이 완벽한 동일 수평선 상에 존재 (θ ≒ π)
            else if (Math.abs(A.y - B.y) < 0.02) {
                isCollinear = true;
                reason = "세 점이 모두 수평선 y = -1 위에 나란히 정렬되었습니다. (θ = π)";
            }

            // 5. 삼각형 그리기 (일직선 상태에 따른 색상 변조 피드백)
            if (isCollinear) {
                ctx.fillStyle = 'rgba(239, 68, 68, 0.2)';
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 4;
                alignAlert.style.display = 'block';
                alignReason.innerText = reason;
            } else {
                ctx.fillStyle = 'rgba(2, 132, 199, 0.15)';
                ctx.strokeStyle = '#0284c7';
                ctx.lineWidth = 2.5;
                alignAlert.style.display = 'none';
            }

            ctx.beginPath();
            ctx.moveTo(toCanvasX(A.x), toCanvasY(A.y));
            ctx.lineTo(toCanvasX(B.x), toCanvasY(B.y));
            ctx.lineTo(toCanvasX(C.x), toCanvasY(C.y));
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 6. 점 마킹 및 텍스트
            const points = [{pt:A, col:'#ef4444', name:'A'}, {pt:B, col:'#22c55e', name:'B'}, {pt:C, col:'#f97316', name:'C'}];
            points.forEach(p => {
                ctx.fillStyle = p.col;
                ctx.beginPath();
                ctx.arc(toCanvasX(p.pt.x), toCanvasY(p.pt.y), 7, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#1e293b';
                ctx.font = 'bold 13px sans-serif';
                ctx.fillText(p.name, toCanvasX(p.pt.x) + 10, toCanvasY(p.pt.y) - 6);
            });

            // 7. 실시간 면적 계산 및 최댓값 갱신
            const area = 0.5 * Math.abs(A.x * (B.y - C.y) + B.x * (C.y - A.y) + C.x * (A.y - B.y));
            currArea.innerText = area.toFixed(4);

            if (area > maxAreaVal) {
                maxAreaVal = area;
                maxAreaDisp.innerText = maxAreaVal.toFixed(4);
            }
        }

        // 애니메이션 루프 제어 함수
        function updateAnimation() {
            if (!isPlaying) return;
            let val = parseFloat(slider.value);
            val += 0.005;
            if (val > 6.28318) val = 0; // 2*pi 돌면 초기화 회전
            slider.value = val;
            draw();
            animationFrameId = requestAnimationFrame(updateAnimation);
        }

        playBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playBtn.innerText = "⏸ 정지";
                updateAnimation();
            } else {
                playBtn.innerText = "▶ 재생";
                cancelAnimationFrame(animationFrameId);
            }
        });

        resetMaxBtn.addEventListener('click', () => {
            maxAreaVal = 0;
            maxAreaDisp.innerText = "0.0000";
            draw();
        });

        slider.addEventListener('input', () => {
            if(isPlaying) {
                isPlaying = false;
                playBtn.innerText = "▶ 재생";
                cancelAnimationFrame(animationFrameId);
            }
            draw();
        });

        draw();
    </script>
</body>
</html>
