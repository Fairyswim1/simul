<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이차곡선 단면 시뮬레이터 (탑 뷰 시인성 개선)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; color: white; font-family: 'Malgun Gothic', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui-panel {
            position: absolute; top: 20px; left: 20px;
            background: rgba(20, 20, 20, 0.95);
            padding: 20px; border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            width: 320px;
            z-index: 100;
            border: 1px solid #444;
        }
        h2 { margin-top: 0; font-size: 1.2rem; color: #4CAF50; border-bottom: 1px solid #555; padding-bottom: 10px; text-align: center;}
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #eee; }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: #4CAF50; }
        .value-display { float: right; font-weight: bold; color: #4CAF50; }
        #result-box {
            margin-top: 20px; padding: 15px;
            background: #2a2a2a; border-radius: 8px;
            text-align: center; font-size: 1.3rem; font-weight: bold;
            border: 1px solid #555;
        }
        .instructions { font-size: 0.8rem; color: #aaa; margin-top: 15px; line-height: 1.6; border-top: 1px solid #555; padding-top: 10px;}
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-panel">
        <h2>이차곡선 단면 시뮬레이터</h2>
        
        <div class="control-group">
            <label>모선과 밑면 각 (α) <span id="val-alpha" class="value-display">60°</span></label>
            <input type="range" id="slider-alpha" min="20" max="80" value="60" step="1">
        </div>

        <div class="control-group">
            <label>단면과 밑면 각 (θ) <span id="val-theta" class="value-display">30°</span></label>
            <input type="range" id="slider-theta" min="0" max="89" value="30" step="1">
        </div>

        <div class="control-group">
            <label>단면 높이 <span id="val-height" class="value-display">50%</span></label>
            <input type="range" id="slider-height" min="10" max="90" value="50" step="1">
        </div>

        <div id="result-box">
            단면: <span id="shape-name" style="color: #f1c40f;">타원</span>
        </div>

        <div class="instructions">
            <b>[조작 방법]</b><br>
            * 마우스 좌클릭 + 드래그: 화면 회전<br>
            * 마우스 휠: 줌 인/아웃<br>
            * 마우스 우클릭 + 드래그: 화면 이동<br>
            <br>
            <i>💡 카메라를 위로 회전하여 정탑 뷰(Top View)로 보더라도 단면이 흐려지지 않고 진한 솔리드 색상으로 뚜렷하게 관찰됩니다.</i>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // 1. 기본 씬 설정
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a); // 어두운 배경

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 35, 25); // 정탑 뷰 관찰이 편하도록 초기 카메라 위치 조정

        const renderer = new THREE.WebGLRenderer({ antialias: true, stencil: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.localClippingEnabled = true; // 클리핑 활성화
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 10, 0);
        controls.enableDamping = true; // 부드러운 회전
        controls.update();

        // 조명 설정
        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // 바닥 그리드
        scene.add(new THREE.GridHelper(50, 50, 0x333333, 0x111111));

        // 2. 주요 객체 변수
        let coneGeometry;
        let wireMesh;     
        let coneMesh;     
        let stencilGroup; 
        let capMesh;      
        let capWireMesh; 
        const radius = 10;
        const clipPlane = new THREE.Plane(); // 절단 평면

        // 3. 스텐실 캡(단면 채우기)을 위한 내부 로직
        function createPlaneStencilGroup(geometry, plane, renderOrder) {
            const group = new THREE.Group();
            const baseMat = new THREE.MeshBasicMaterial();
            baseMat.depthWrite = false;
            baseMat.depthTest = false;
            baseMat.colorWrite = false;
            baseMat.stencilWrite = true;
            baseMat.stencilFunc = THREE.AlwaysStencilFunc;

            const mat0 = baseMat.clone();
            mat0.side = THREE.BackSide;
            mat0.clippingPlanes = [plane];
            mat0.stencilFail = THREE.IncrementWrapStencilOp;
            mat0.stencilZFail = THREE.IncrementWrapStencilOp;
            mat0.stencilZPass = THREE.IncrementWrapStencilOp;
            const mesh0 = new THREE.Mesh(geometry, mat0);
            mesh0.renderOrder = renderOrder;
            group.add(mesh0);

            const mat1 = baseMat.clone();
            mat1.side = THREE.FrontSide;
            mat1.clippingPlanes = [plane];
            mat1.stencilFail = THREE.DecrementWrapStencilOp;
            mat1.stencilZFail = THREE.DecrementWrapStencilOp;
            mat1.stencilZPass = THREE.DecrementWrapStencilOp;
            const mesh1 = new THREE.Mesh(geometry, mat1);
            mesh1.renderOrder = renderOrder;
            group.add(mesh1);

            return group;
        }

        // 4. 시뮬레이터 업데이트 함수
        function updateScene() {
            const alphaDeg = parseFloat(document.getElementById('slider-alpha').value);
            const thetaDeg = parseFloat(document.getElementById('slider-theta').value);
            const heightRatio = parseFloat(document.getElementById('slider-height').value) / 100;

            document.getElementById('val-alpha').innerText = alphaDeg + '°';
            document.getElementById('val-theta').innerText = thetaDeg + '°';
            document.getElementById('val-height').innerText = Math.round(heightRatio * 100) + '%';

            const alpha = alphaDeg * Math.PI / 180;
            const theta = thetaDeg * Math.PI / 180;
            const height = radius * Math.tan(alpha);

            // 기존 객체 지우기
            if (coneGeometry) coneGeometry.dispose();
            if (wireMesh) scene.remove(wireMesh);
            if (coneMesh) scene.remove(coneMesh);
            if (stencilGroup) scene.remove(stencilGroup);
            if (capMesh) scene.remove(capMesh);
            if (capWireMesh) scene.remove(capWireMesh);

            // 원뿔 기하학 생성 (밑면을 y=0으로)
            coneGeometry = new THREE.ConeGeometry(radius, height, 64, 1, false);
            coneGeometry.translate(0, height / 2, 0);

            // 절단 평면 계산
            const ny = Math.cos(theta);
            const nz = Math.sin(theta);
            const normal = new THREE.Vector3(0, ny, nz).normalize();
            const y0 = height * heightRatio;
            const d = -ny * y0;
            clipPlane.set(normal, d);

            // ----------------------------------------------------
            // 시각화 1: 원뿔의 전체 형태 (희미한 와이어프레임)
            // ----------------------------------------------------
            const wireMaterial = new THREE.MeshBasicMaterial({
                color: 0x555555,
                wireframe: true,
                transparent: true,
                opacity: 0.15 
            });
            wireMesh = new THREE.Mesh(coneGeometry, wireMaterial);
            scene.add(wireMesh);

            // ----------------------------------------------------
            // 시각화 2: 스텐실 마스크 (단면 영역 계산용)
            // ----------------------------------------------------
            stencilGroup = createPlaneStencilGroup(coneGeometry, clipPlane, 1);
            scene.add(stencilGroup);

            // ----------------------------------------------------
            // 시각화 3: 반투명하게 잘린 원뿔
            // ----------------------------------------------------
            const coneMaterial = new THREE.MeshStandardMaterial({
                color: 0x1e90ff, 
                transparent: true,
                opacity: 0.08, // 탑 뷰 시인성을 위해 투명도를 살짝 더 높임  
                side: THREE.DoubleSide,
                clippingPlanes: [clipPlane],
                depthWrite: false, 
                roughness: 0.1,
                metalness: 0.1
            });
            coneMesh = new THREE.Mesh(coneGeometry, coneMaterial);
            coneMesh.renderOrder = 2;
            scene.add(coneMesh);

            // ----------------------------------------------------
            // 시각화 4: 색칠된 단면 (캡) - 탑 뷰 버그 해결
            // ----------------------------------------------------
            let shapeName = "";
            let shapeColor = 0xffffff;

            if (thetaDeg === 0) {
                shapeName = "원 (Circle)"; shapeColor = 0x2ecc71; // 초록
            } else if (thetaDeg < alphaDeg) {
                shapeName = "타원 (Ellipse)"; shapeColor = 0xf1c40f; // 노랑
            } else if (thetaDeg === alphaDeg) {
                shapeName = "포물선 (Parabola)"; shapeColor = 0xe67e22; // 주황
            } else {
                shapeName = "쌍곡선 (Hyperbola)"; shapeColor = 0xe74c3c; // 빨강
            }

            const shapeEl = document.getElementById('shape-name');
            shapeEl.innerText = shapeName;
            shapeEl.style.color = '#' + shapeColor.toString(16);

            // 단면을 구성할 원형 평면
            const capGeometry = new THREE.CircleGeometry(radius * 2, 64);
            
            const capMaterial = new THREE.MeshBasicMaterial({ 
                color: shapeColor,
                side: THREE.DoubleSide,
                // [핵심 변경] clippingPlanes 지정을 해제하여 탑 뷰에서의 수치 에러 처리(단면 깜빡임) 방지
                stencilWrite: true,
                stencilRef: 1,
                stencilFunc: THREE.EqualStencilFunc, 
                stencilFail: THREE.ReplaceStencilOp,
                stencilZFail: THREE.ReplaceStencilOp,
                stencilZPass: THREE.ReplaceStencilOp,
                transparent: false,
                depthWrite: true // 뎁스 버퍼에 확실히 기록하여 투명 원뿔 위로 선명하게 올라오도록 설정
            });
            
            capMesh = new THREE.Mesh(capGeometry, capMaterial);
            capMesh.position.set(0, y0, 0);
            capMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
            capMesh.renderOrder = 3;
            scene.add(capMesh);

            // ----------------------------------------------------
            // 시각화 5: 단면 테두리
            // ----------------------------------------------------
            const edgesGeometry = new THREE.EdgesGeometry(coneGeometry);
            const edgesMaterial = new THREE.LineBasicMaterial({
                color: 0xffffff, 
                clippingPlanes: [clipPlane],
                stencilWrite: true,
                stencilRef: 1,
                stencilFunc: THREE.EqualStencilFunc,
                transparent: false,
                linewidth: 2 
            });
            capWireMesh = new THREE.LineSegments(edgesGeometry, edgesMaterial);
            capWireMesh.renderOrder = 4;
            scene.add(capWireMesh);
        }

        // 이벤트 리스너
        document.getElementById('slider-alpha').addEventListener('input', updateScene);
        document.getElementById('slider-theta').addEventListener('input', updateScene);
        document.getElementById('slider-height').addEventListener('input', updateScene);

        updateScene();

        // 5. 렌더링 루프
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // 창 크기 변경 대응
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
