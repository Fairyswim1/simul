<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문제 6. 4기둥 하노이 탑 시뮬레이터 (Canvas)</title>
    <style>
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: #333;
            margin: 0;
        }
        h1 { margin-bottom: 10px; font-size: 24px; text-align: center; }
        .controls {
            background: white;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .controls label { font-weight: bold; }
        .controls input[type="range"] { cursor: pointer; }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background-color: #4a90e2;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #357abd; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #btn-reset { background-color: #e74c3c; }
        #btn-reset:hover { background-color: #c0392b; }
        
        .info-panel {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            background: #fff;
            padding: 15px 30px;
            border-radius: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 2px solid #4a90e2;
            text-align: center;
        }
        .highlight { color: #e74c3c; font-size: 22px; }
        
        /* 캔버스 스타일 추가 */
        canvas {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: block;
        }
    </style>
</head>
<body>

    <h1>문제 6. 접시 4개(A, B, C, D) 하노이 탑 시뮬레이터</h1>
    
    <div class="controls">
        <label>원판 개수: <span id="disk-count-display">6</span>개</label>
        <input type="range" id="disk-slider" min="1" max="10" value="6">
        <button id="btn-play">자동 재생</button>
        <button id="btn-reset">초기화</button>
        <label>재생 속도:</label>
        <input type="range" id="speed-slider" min="1" max="100" value="70">
    </div>

    <div class="info-panel">
        현재 이동 횟수: <span id="current-moves" class="highlight">0</span> / 최소 이동 횟수: <span id="min-moves">?</span>
    </div>

    <!-- HTML5 Canvas 요소로 변경 -->
    <canvas id="gameCanvas" width="800" height="350"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FDCB6E', '#6C5CE7', '#E84393', '#00B894', '#0984E3', '#D63031', '#2D3436'];
        const pegNames = ['A', 'B', 'C', 'D'];
        
        let numDisks = 6;
        let pegs = [[], [], [], []];
        let movesList = [];
        let isPlaying = false;
        let currentMoveIndex = 0;

        const ui = {
            slider: document.getElementById('disk-slider'),
            speedSlider: document.getElementById('speed-slider'),
            countDisplay: document.getElementById('disk-count-display'),
            btnPlay: document.getElementById('btn-play'),
            btnReset: document.getElementById('btn-reset'),
            currentMoves: document.getElementById('current-moves'),
            minMoves: document.getElementById('min-moves')
        };

        // Frame-Stewart Algorithm
        function getOptimalK(n) {
            let m = 1;
            while ((m * (m + 1)) / 2 < n) { m++; }
            return n - m;
        }

        function move3(n, source, dest, aux) {
            if (n === 0) return;
            move3(n - 1, source, aux, dest);
            movesList.push({ from: source, to: dest });
            move3(n - 1, aux, dest, source);
        }

        function move4(n, source, dest, aux1, aux2) {
            if (n === 0) return;
            if (n === 1) {
                movesList.push({ from: source, to: dest });
                return;
            }
            let k = getOptimalK(n);
            move4(k, source, aux1, dest, aux2);
            move3(n - k, source, dest, aux2);
            move4(k, aux1, dest, source, aux2);
        }

        function calculateMoves() {
            movesList = [];
            move4(numDisks, 0, 3, 1, 2);
        }

        function initGame() {
            isPlaying = false;
            currentMoveIndex = 0;
            ui.currentMoves.innerText = "0";
            ui.minMoves.innerText = "?";
            ui.btnPlay.innerText = "자동 재생";
            ui.btnPlay.disabled = false;
            ui.slider.disabled = false;
            
            pegs = [[], [], [], []];
            for (let i = numDisks; i >= 1; i--) {
                pegs[0].push(i);
            }
            
            calculateMoves();
            drawCanvas(); // 초기 상태 렌더링
        }

        // --- Canvas 렌더링 로직 ---
        function drawCanvas() {
            // 캔버스 초기화
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const pegPositionsX = [140, 313, 486, 660]; // 4개의 기둥 X좌표
            const baseY = 280; // 바닥 Y좌표
            const poleWidth = 12;
            const poleHeight = 220;
            const diskHeight = 22;

            // 1. 기둥과 바닥 그리기
            for (let i = 0; i < 4; i++) {
                const px = pegPositionsX[i];
                
                // 기둥 (Pole)
                ctx.fillStyle = '#8B4513';
                // 둥근 모서리를 위해 roundRect 사용 (호환성이 필요할 경우 fillRect로 대체 가능)
                if(ctx.roundRect) {
                    ctx.beginPath();
                    ctx.roundRect(px - poleWidth / 2, baseY - poleHeight, poleWidth, poleHeight, [6, 6, 0, 0]);
                    ctx.fill();
                } else {
                    ctx.fillRect(px - poleWidth / 2, baseY - poleHeight, poleWidth, poleHeight);
                }

                // 바닥 (Base)
                if(ctx.roundRect) {
                    ctx.beginPath();
                    ctx.roundRect(px - 60, baseY, 120, 15, 5);
                    ctx.fill();
                } else {
                    ctx.fillRect(px - 60, baseY, 120, 15);
                }

                // 접시 이름 텍스트 (A, B, C, D)
                ctx.fillStyle = '#555';
                ctx.font = 'bold 20px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`접시 ${pegNames[i]}`, px, baseY + 45);
            }

            // 2. 원판 그리기
            for (let p = 0; p < 4; p++) {
                const px = pegPositionsX[p];
                for (let d = 0; d < pegs[p].length; d++) {
                    const diskSize = pegs[p][d];
                    const diskWidth = 40 + diskSize * 10;
                    const dx = px - diskWidth / 2;
                    const dy = baseY - (d + 1) * diskHeight; // 쌓인 높이 계산

                    // 그림자 효과 설정
                    ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    ctx.shadowBlur = 4;
                    ctx.shadowOffsetY = 2;

                    // 원판 몸체
                    ctx.fillStyle = colors[(diskSize - 1) % colors.length];
                    ctx.beginPath();
                    if(ctx.roundRect) {
                        ctx.roundRect(dx, dy, diskWidth, diskHeight, 11); // 모서리 둥글게
                    } else {
                        ctx.fillRect(dx, dy, diskWidth, diskHeight);
                    }
                    ctx.fill();

                    // 그림자 초기화 (텍스트에 안 들어가게)
                    ctx.shadowColor = 'transparent';

                    // 원판 번호 (크기)
                    ctx.fillStyle = 'white';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(diskSize, px, dy + diskHeight / 2);
                }
            }
        }

        // 속도 계산 함수
        function getDelay() {
            const speedValue = parseInt(ui.speedSlider.value);
            return 1050 - (speedValue * 10);
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function playAnimation() {
            if (isPlaying) return;
            isPlaying = true;
            ui.btnPlay.innerText = "일시정지";
            ui.slider.disabled = true;

            while (currentMoveIndex < movesList.length && isPlaying) {
                const move = movesList[currentMoveIndex];
                
                // 데이터 이동
                const disk = pegs[move.from].pop();
                pegs[move.to].push(disk);
                
                // 캔버스 다시 그리기
                drawCanvas();
                
                currentMoveIndex++;
                ui.currentMoves.innerText = currentMoveIndex;
                
                await sleep(getDelay());
            }
            
            if (currentMoveIndex >= movesList.length) {
                ui.btnPlay.innerText = "완료!";
                ui.btnPlay.disabled = true;
                ui.minMoves.innerText = movesList.length;
                ui.slider.disabled = false;
            }
        }

        // Event Listeners
        ui.slider.addEventListener('input', (e) => {
            numDisks = parseInt(e.target.value);
            ui.countDisplay.innerText = numDisks;
            initGame();
        });

        ui.btnPlay.addEventListener('click', () => {
            if (currentMoveIndex >= movesList.length) return;

            if (isPlaying) {
                isPlaying = false;
                ui.btnPlay.innerText = "계속 재생";
            } else {
                playAnimation();
            }
        });

        ui.btnReset.addEventListener('click', () => {
            isPlaying = false;
            setTimeout(initGame, getDelay() + 10);
        });

        // 초기 시작
        window.onload = initGame;
    </script>
</body>
</html>
